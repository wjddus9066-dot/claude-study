    function formatTime(sec) {
      const total = Math.max(0, sec);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    /** 조리 타이머 — 1초 간격 카운트업, 총 시간에 도달하면 자동 정지 */
    function useCookTimer(total) {
      const [elapsed, setElapsed] = useState(0);
      const [running, setRunning] = useState(false);

      useEffect(() => {
        if (!running) return;
        const id = setInterval(() => {
          setElapsed(prev => {
            if (prev + 1 >= total) {
              setRunning(false);
              return total;
            }
            return prev + 1;
          });
        }, 1000);
        return () => clearInterval(id);
      }, [running, total]);

      const start = useCallback(() => setRunning(true), []);
      const pause = useCallback(() => setRunning(false), []);
      const reset = useCallback(() => { setRunning(false); setElapsed(0); }, []);

      return { elapsed, running, start, pause, reset, done: elapsed >= total };
    }

    /** 체크리스트 상태를 Set 으로 관리 */
    function useCheckSet() {
      const [set, setSet] = useState(() => new Set());
      const toggle = useCallback(key => {
        setSet(prev => {
          const next = new Set(prev);
          if (next.has(key)) next.delete(key); else next.add(key);
          return next;
        });
      }, []);
      const clear = useCallback(() => setSet(new Set()), []);
      return { set, toggle, clear };
    }

          <div className="mb-4 flex items-center gap-3">
            <div className="h-1.5 flex-1 overflow-hidden rounded-full bg-stone-200">
              <div
                className="h-full rounded-full bg-amber-500 transition-all duration-300"
                style={{ width: `${(set.size / total) * 100}%` }}
              />
            </div>
            <span className="flex-none text-xs font-semibold tabular-nums text-stone-500">{set.size} / {total}</span>
            <Button variant="ghost" size="sm" onClick={clear} disabled={set.size === 0}>초기화</Button>
          </div>

          <div className="grid gap-4 md:grid-cols-2">
            {INGREDIENT_GROUPS.map(group => (
              <Card key={group.id} className={`p-4 sm:p-5 ${group.id === 'sauce' ? 'ring-1 ring-amber-200' : ''}`}>
                <div className="mb-2 flex flex-wrap items-center gap-2">
                  <h3 className="text-sm font-bold text-stone-900">{group.title}</h3>
                  {group.note && <Badge tone="red">{group.note}</Badge>}
                </div>
                <ul className="-mx-2">
                  {group.items.map(item => {
                    const key = `${group.id}:${item.name}`;
                    return (
                      <li key={key}>
                        <CheckItem checked={set.has(key)} onToggle={() => toggle(key)}>
                          <span className="flex flex-wrap items-baseline gap-x-2">
                            <span className="font-semibold">{item.name}</span>
                            <span className="text-amber-700">{item.amount}</span>
                          </span>
                          {item.memo && <span className="mt-0.5 block text-xs text-stone-500">{item.memo}</span>}
                        </CheckItem>
                      </li>
                    );
                  })}
                </ul>
              </Card>
            ))}

            <Card className="p-4 sm:p-5">
              <h3 className="mb-3 text-sm font-bold text-stone-900">도구</h3>
              <ul className="space-y-2 text-sm text-stone-600">
                {TOOLS.map(tool => (
                  <li key={tool} className="flex items-start gap-2">
                    <span aria-hidden="true" className="mt-1.5 h-1.5 w-1.5 flex-none rounded-full bg-amber-400" />
                    {tool}
                  </li>
                ))}
              </ul>
            </Card>
          </div>

          <div className="mt-4">
            <Note>
              <strong className="font-semibold">물 1큰술이 왜 들어가나:</strong> 간장만 팬에 부으면 순식간에 타서 쓴맛이 난다.
              물이 온도를 낮춰주는 완충재 역할을 하고, 졸아들면서 농도가 딱 맞게 잡힌다.
            </Note>
          </div>
        </Section>
      );
    }

    function TimerSection({ timer, activeStep }) {
      const { elapsed, running, start, pause, reset, done } = timer;
      const progress = elapsed / TOTAL_SECONDS;
      const R = 78;
      const C = 2 * Math.PI * R;

      return (
        <Section
          id="timer"
          eyebrow="Timeline"
          title="8분 타이머"
          description="시작을 누르면 지금 어느 단계에 있어야 하는지 실시간으로 알려줍니다. 준비(2분)부터 함께 셉니다."
        >
          <Card className="overflow-hidden">
            <div className="grid gap-6 p-5 sm:p-7 md:grid-cols-[auto_1fr] md:items-center">
              {/* 진행 링 */}
              <div className="relative mx-auto h-48 w-48 flex-none">
                <svg viewBox="0 0 180 180" className="h-full w-full -rotate-90" aria-hidden="true">
                  <circle cx="90" cy="90" r={R} fill="none" stroke="#e7e5e4" strokeWidth="12" />
                  <circle
                    cx="90" cy="90" r={R} fill="none"
                    stroke={done ? '#059669' : '#d97706'}
                    strokeWidth="12" strokeLinecap="round"
                    strokeDasharray={C}
                    strokeDashoffset={C * (1 - progress)}
                    className="ring-progress"
                  />
                </svg>
                <div className="absolute inset-0 flex flex-col items-center justify-center">
                  <span className={`text-4xl font-black tabular-nums tracking-tight ${done ? 'text-emerald-600' : 'text-stone-900'}`}>
                    {formatTime(elapsed)}
                  </span>
                  <span className="mt-1 text-xs font-semibold text-stone-400">/ {formatTime(TOTAL_SECONDS)}</span>
                  {running && (
                    <span className="pulse-ring mt-2 text-[11px] font-bold uppercase tracking-widest text-amber-600">조리 중</span>
                  )}
                </div>
              </div>

              {/* 현재 단계 + 컨트롤 */}
              <div>
                <div aria-live="polite" className="min-h-[104px]">
                  {done ? (
                    <>
                      <Badge tone="green">완성</Badge>
                      <h3 className="mt-2 text-xl font-bold text-stone-900">8분 완료 — 바로 드세요</h3>
                      <p className="mt-1 text-sm leading-relaxed text-stone-600">
                        완성된 계란밥은 보관에 부적합합니다. 노른자를 터뜨려 비빈 뒤 5초 기다렸다 드세요.
                      </p>
                    </>
                  ) : (
                    <>
                      <Badge tone={running ? 'amber' : 'stone'}>
                        {running ? `${activeStep.n}단계 진행 중` : '대기 중'}
                      </Badge>
                      <h3 className="mt-2 text-xl font-bold text-stone-900">{activeStep.title}</h3>
                      <p className="mt-1 text-sm leading-relaxed text-stone-600">{activeStep.summary}</p>
                      <p className="mt-2 text-xs font-semibold tabular-nums text-amber-700">
                        이 단계 남은 시간 {formatTime(activeStep.end - elapsed)}
                      </p>
                    </>
                  )}
                </div>

                <div className="mt-5 flex flex-wrap gap-2">
                  {running ? (
                    <Button variant="secondary" size="lg" onClick={pause}>일시정지</Button>
                  ) : (
                    <Button size="lg" onClick={start} disabled={done}>{elapsed === 0 ? '시작' : '이어서'}</Button>
                  )}
                  <Button variant="ghost" size="lg" onClick={reset} disabled={elapsed === 0}>초기화</Button>
                </div>

                {/* 단계별 타임라인 바 */}
                <ol className="mt-6 flex gap-1" aria-label="단계별 타임라인">
                  {STEPS.map(step => {
                    const width = ((step.end - step.start) / TOTAL_SECONDS) * 100;
                    const isPast = elapsed >= step.end;
                    const isNow = !done && elapsed >= step.start && elapsed < step.end;
                    return (
                      <li key={step.n} style={{ width: `${width}%` }} className="min-w-0">
                        <div className={`h-2 rounded-full transition-colors ${isPast ? 'bg-amber-600' : isNow ? 'bg-amber-400' : 'bg-stone-200'}`} />
                        <p className={`mt-1.5 truncate text-[10px] font-semibold ${isNow ? 'text-amber-700' : 'text-stone-400'}`}>
                          {step.n}. {step.title}
                        </p>
                      </li>
                    );
                  })}
                </ol>
              </div>
            </div>
          </Card>
        </Section>
      );
    }

    function StepsSection({ activeStep, running }) {
      const { set, toggle } = useCheckSet();

      return (
        <Section
          id="steps"
          eyebrow="How to"
          title="만드는 법"
          description="한 단계씩 체크하며 따라가세요. 타이머가 돌아가는 중이면 지금 해야 할 단계가 강조됩니다."
        >
          <ol className="space-y-4">
            {STEPS.map(step => {
              const isNow = running && activeStep.n === step.n;
              const isDone = set.has(step.n);
              return (
                <li key={step.n}>
                  <Card className={`overflow-hidden transition-shadow ${isNow ? 'ring-2 ring-amber-400 shadow-md' : ''} ${isDone ? 'opacity-70' : ''}`}>
                    <div className="flex items-start gap-4 p-5">
                      <button
                        type="button"
                        onClick={() => toggle(step.n)}
                        aria-pressed={isDone}
                        aria-label={`${step.n}단계 ${step.title} 완료 표시`}
                        className={`flex h-10 w-10 flex-none items-center justify-center rounded-full text-base font-black transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 ${
                          isDone
                            ? 'bg-emerald-500 text-white'
                            : isNow
                              ? 'bg-amber-500 text-white'
                              : 'bg-stone-100 text-stone-500 hover:bg-amber-100 hover:text-amber-700'
                        }`}
                      >
                        {isDone ? '✓' : step.n}
                      </button>

                      <div className="min-w-0 flex-1">
                        <div className="flex flex-wrap items-center gap-2">
                          <h3 className={`text-lg font-bold ${isDone ? 'text-stone-400 line-through' : 'text-stone-900'}`}>{step.title}</h3>
                          <Badge tone={isNow ? 'amber' : 'stone'}>
                            {formatTime(step.start)}–{formatTime(step.end)}
                          </Badge>
                        </div>
                        <p className="mt-1 text-sm text-stone-500">{step.summary}</p>

                        <ul className="mt-3 space-y-2">
                          {step.body.map((line, i) => (
                            <li key={i} className="flex items-start gap-2.5 text-sm leading-relaxed text-stone-700">
                              <span aria-hidden="true" className="mt-2 h-1.5 w-1.5 flex-none rounded-full bg-amber-400" />
                              <span>{line}</span>
                            </li>
                          ))}
                        </ul>

                        {step.note && <div className="mt-3"><Note>{step.note}</Note></div>}
                      </div>
                    </div>
                  </Card>
                </li>
              );
            })}
          </ol>
        </Section>
      );
    }

    function TroubleSection() {
      return (
        <Section
          id="trouble"
          eyebrow="Troubleshooting"
          title="실패 진단표"
          description="맛이 이상하다면 증상부터 찾으세요. 원인은 대부분 불 세기와 소스 붓는 위치입니다."
        >
          <Card className="overflow-hidden">
            {TROUBLES.map(t => (
              <Accordion key={t.symptom} title={t.symptom} subtitle={`원인 · ${t.cause}`}>
                <div className="rounded-xl bg-emerald-50 px-4 py-3 text-sm leading-relaxed text-emerald-900">
                  <span className="font-bold">해결 </span>{t.fix}
                </div>
              </Accordion>
            ))}
          </Card>

          <div className="mt-4">
            <Note>
              공통 실패 원인 톱 3 — ① 물기를 안 뺐다 ② 불이 셌다 ③ 양념을 한 번에 다 넣었다.
              절반만 넣고 맛보는 습관 하나로 실패가 절반 줄어듭니다.
            </Note>
          </div>
        </Section>
      );
    }

    function MoreSection() {
      return (
        <Section
          id="more"
          eyebrow="Beyond"
          title="응용 · 대체 · 보관"
          description="기본을 익혔다면 여기서부터가 진짜입니다."
        >
          <div className="grid gap-4 md:grid-cols-2">
            <Card className="p-5">
              <h3 className="mb-3 text-sm font-bold text-stone-900">응용</h3>
              <ul className="space-y-3">
                {VARIATIONS.map(v => (
                  <li key={v.title} className="text-sm leading-relaxed">
                    <span className="font-semibold text-amber-700">{v.title}</span>
                    <span className="text-stone-600"> — {v.body}</span>
                  </li>
                ))}
              </ul>
            </Card>

            <div className="space-y-4">
              <Card className="overflow-hidden">
                <h3 className="px-5 pt-5 text-sm font-bold text-stone-900">재료 대체</h3>
                <div className="mt-3 overflow-x-auto">
                  <table className="w-full min-w-[320px] text-left text-sm">
                    <thead>
                      <tr className="border-y border-stone-200 bg-stone-50 text-xs uppercase tracking-wide text-stone-400">
                        <th scope="col" className="px-5 py-2 font-semibold">없으면</th>
                        <th scope="col" className="px-5 py-2 font-semibold">대신</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-stone-100">
                      {SUBSTITUTES.map(s => (
                        <tr key={s.missing}>
                          <th scope="row" className="whitespace-nowrap px-5 py-3 text-left font-semibold text-stone-800">{s.missing}</th>
                          <td className="px-5 py-3 text-stone-600">{s.instead}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </Card>

              <Card className="p-5">
                <h3 className="mb-2 text-sm font-bold text-stone-900">보관</h3>
                <p className="text-sm leading-relaxed text-stone-600">
                  소스만 따로 <strong className="font-semibold text-stone-800">3~4배로 만들어 밀폐용기</strong>에 넣으면 냉장 2주.
                  계란밥·볶음밥·두부덮밥에 그대로 쓸 수 있습니다.
                  완성된 계란밥은 보관에 부적합하니 바로 드세요.
                </p>
              </Card>
            </div>
          </div>
        </Section>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const timer = useCookTimer(TOTAL_SECONDS);
      const [activeId, setActiveId] = useState(NAV[0].id);

      const activeStep = useMemo(
        () => STEPS.find(s => timer.elapsed >= s.start && timer.elapsed < s.end) || STEPS[STEPS.length - 1],
        [timer.elapsed]
      );

      // 스크롤 위치에 따라 상단 내비게이션 활성 항목을 갱신
      useEffect(() => {
        const observer = new IntersectionObserver(
          entries => {
            const visible = entries
              .filter(e => e.isIntersecting)
              .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
            if (visible.length > 0) setActiveId(visible[0].target.id);
          },
          { rootMargin: '-72px 0px -60% 0px', threshold: 0 }
        );
        NAV.forEach(item => {
          const el = document.getElementById(item.id);
          if (el) observer.observe(el);
        });
        return () => observer.disconnect();
      }, []);

      return (
        <div className="min-h-screen">
          <Header activeId={activeId} />
          <main className="mx-auto max-w-4xl px-4 pb-4 sm:px-6">
            <Hero />
            <IngredientsSection />
            <TimerSection timer={timer} activeStep={activeStep} />
            <StepsSection activeStep={activeStep} running={timer.running} />
            <TroubleSection />
            <MoreSection />
          </main>
          <Footer />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
