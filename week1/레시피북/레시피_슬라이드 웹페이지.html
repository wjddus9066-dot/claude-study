    /* Tailwind 유틸리티로 표현 불가한 것 (폰트 스택 · 키프레임 · 텍스트 그라디언트) */
    :root {
      --font-story: 'Gowun Batang', 'Nanum Myeongjo', serif;
      --font-body: 'Gowun Dodum', system-ui, sans-serif;
      --font-deco: 'Cinzel Decorative', serif;

    body {

      background: #0b1026;
      overflow: hidden;
    }
    .font-story { font-family: var(--font-story); }
    .font-deco { font-family: var(--font-deco); letter-spacing: .06em; }

    /* 황금빛 제목 */
    .gold-text {
      background: linear-gradient(180deg, #fff6d5 0%, #f7d774 45%, #d9a521 75%, #fbe7a1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.7); }
      50%      { opacity: 1;   transform: scale(1); }
    }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }
    .floaty { animation: floaty 6s ease-in-out infinite; }

    @keyframes slide-in-right {
      from { opacity: 0; transform: translateX(46px) scale(.985); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes slide-in-left {
      from { opacity: 0; transform: translateX(-46px) scale(.985); }
      to   { opacity: 1; transform: none; }
    }
    .enter-next { animation: slide-in-right .5s cubic-bezier(.22,.9,.3,1) both; }
    .enter-prev { animation: slide-in-left .5s cubic-bezier(.22,.9,.3,1) both; }

    @keyframes rise-up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }
    .rise-up { animation: rise-up .6s cubic-bezier(.22,.9,.3,1) both; }

    @keyframes sweep {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
    .sweep { animation: sweep 3.4s ease-in-out infinite; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @media (prefers-reduced-motion: reduce) {
      .twinkle, .floaty, .enter-next, .enter-prev, .rise-up, .sweep { animation: none !important; }
    }

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children, ...rest }) {
      const variants = {
        primary: 'bg-gradient-to-b from-amber-300 to-amber-500 text-[#2a1a05] hover:from-amber-200 hover:to-amber-400 shadow-lg shadow-amber-500/25',
        secondary: 'bg-white/10 text-amber-50 border border-amber-200/30 hover:bg-white/20 backdrop-blur',
        danger: 'bg-rose-600 text-white hover:bg-rose-500 shadow-lg shadow-rose-900/30',
        ghost: 'bg-transparent text-amber-100/70 hover:text-amber-50 hover:bg-white/10',
      };
      const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-6 py-3 text-base' };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`inline-flex items-center justify-center gap-2 rounded-full font-bold tracking-tight transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0b1026] disabled:opacity-30 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`rounded-2xl border border-amber-200/20 bg-white/[0.07] backdrop-blur-sm shadow-xl shadow-black/20 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'gold', className = '', children }) {
      const tones = {
        gold: 'bg-amber-300/15 text-amber-200 border-amber-200/40',
        soft: 'bg-white/10 text-amber-50/80 border-white/20',
        rose: 'bg-rose-400/15 text-rose-200 border-rose-300/40',
        mint: 'bg-emerald-300/15 text-emerald-200 border-emerald-200/40',
      };
      return (
        <span className={`inline-flex items-center gap-1.5 rounded-full border px-3 py-1 text-xs font-bold tracking-wide ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, size = 'lg', children }) {
      const sizes = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-5xl' };

      useEffect(() => {
        if (!isOpen) return;
        const onKey = e => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label={title}>
          <div className="absolute inset-0 bg-[#060a1a]/85 backdrop-blur-sm" onClick={onClose} />
          <div className={`relative w-full ${sizes[size]} max-h-[86vh] overflow-hidden rounded-3xl border border-amber-200/25 bg-[#111838] shadow-2xl`}>
            <div className="flex items-center justify-between border-b border-amber-200/15 px-6 py-4">
              <h2 className="font-story text-lg font-bold text-amber-100">{title}</h2>
              <Button variant="ghost" size="sm" onClick={onClose} aria-label="닫기">✕ 닫기</Button>
            </div>
            <div className="no-scrollbar max-h-[74vh] overflow-y-auto p-6">{children}</div>
          </div>
        </div>
      );
    }

    /** 슬라이드 인덱스 + 이동 방향(애니메이션용)을 한 덩어리로 관리 */
    function useDeck(total) {
      const [state, setState] = useState({ index: 0, dir: 'next' });

      const goTo = useCallback((target, direction) => {
        setState(prev => {
          const clamped = Math.max(0, Math.min(total - 1, target));
          return { index: clamped, dir: direction || (clamped >= prev.index ? 'next' : 'prev') };
        });
      }, [total]);

      const next = useCallback(
        () => setState(p => ({ index: Math.min(total - 1, p.index + 1), dir: 'next' })),
        [total]
      );

      const prev = useCallback(
        () => setState(p => ({ index: Math.max(0, p.index - 1), dir: 'prev' })),
        []
      );

      return { index: state.index, dir: state.dir, goTo, next, prev };
    }

    /** 전체화면 토글 + 현재 상태 구독 */
    function useFullscreen() {
      const [active, setActive] = useState(false);

      useEffect(() => {
        const onChange = () => setActive(Boolean(document.fullscreenElement));
        document.addEventListener('fullscreenchange', onChange);
        return () => document.removeEventListener('fullscreenchange', onChange);
      }, []);

      const toggle = useCallback(() => {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        } else {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      }, []);

      return { active, toggle };
    }

        { icon: '⏱️', t: '불 켜기 전에 다 준비', d: '미장플라스는 선택이 아니라 필수' },
      ];

      return (
        <div className="text-center">
          <p className="font-deco text-xs font-bold uppercase tracking-[0.4em] text-amber-200/80">The End</p>
          <h2 className="gold-text font-story mt-3 text-4xl font-bold leading-tight sm:text-5xl lg:text-6xl">
            네 가지 주문만 기억하세요
          </h2>

          <ul className="mx-auto mt-9 grid max-w-4xl gap-3 sm:grid-cols-2">
            {PRINCIPLES.map((p, i) => (
              <li key={p.t} className="rise-up" style={{ animationDelay: `${i * 90}ms` }}>
                <Card className="flex items-start gap-4 px-5 py-4 text-left">
                  <span aria-hidden="true" className="text-2xl">{p.icon}</span>
                  <span>
                    <span className="font-story block text-base font-bold text-amber-50">{p.t}</span>
                    <span className="mt-0.5 block text-xs leading-relaxed text-amber-100/60">{p.d}</span>
                  </span>
                </Card>
              </li>
            ))}
          </ul>

          <p className="mt-9 font-story text-lg text-amber-100/70">
            그리고 오래오래 맛있게 먹었답니다.
          </p>

          <div className="mt-6 flex justify-center">
            <Button size="lg" onClick={onRestart}>
              <Sparkle className="h-4 w-4" /> 처음부터 다시 보기
            </Button>
          </div>
        </div>
      );
    }

    // ========================================
    // 🎬 Deck Chrome (컨트롤 · 진행바 · 목차 모달)
    // ========================================

    function ProgressBar({ index, total, accent }) {
      const a = ACCENTS[accent] || ACCENTS.amber;
      const pct = ((index + 1) / total) * 100;
      return (
        <div className="absolute inset-x-0 top-0 z-30 h-1 bg-white/5">
          <div
            className={`relative h-full bg-gradient-to-r ${a.bar} transition-all duration-500 ease-out`}
            style={{ width: `${pct}%` }}
          >
            <span className="absolute right-0 top-1/2 h-2.5 w-2.5 -translate-y-1/2 translate-x-1/2 rounded-full bg-amber-100 shadow-[0_0_10px_rgba(253,230,138,.9)]" />
          </div>
        </div>
      );
    }

    function DeckControls({ index, total, accent, onPrev, onNext, onOpenOverview, fullscreen, onToggleFullscreen }) {
      const a = ACCENTS[accent] || ACCENTS.amber;
      return (
        <div className="absolute inset-x-0 bottom-0 z-30 flex items-center justify-between gap-4 px-4 py-4 sm:px-8">
          <div className="flex items-center gap-2">
            <Button variant="secondary" size="sm" onClick={onPrev} disabled={index === 0} aria-label="이전 슬라이드">←</Button>
            <Button variant="secondary" size="sm" onClick={onNext} disabled={index === total - 1} aria-label="다음 슬라이드">→</Button>
            <span className="font-deco ml-2 text-xs font-bold tabular-nums text-amber-100/50">
              {String(index + 1).padStart(2, '0')} / {total}
            </span>
          </div>

          {/* 슬라이드 점 (레시피 단위로 굵게) */}
          <ol className="no-scrollbar hidden max-w-[46vw] items-center gap-1.5 overflow-x-auto md:flex" aria-hidden="true">
            {SLIDES.map((s, i) => (
              <li
                key={i}
                className={`h-1.5 flex-none rounded-full transition-all ${
                  i === index ? `w-6 ${a.dot}` : i < index ? 'w-1.5 bg-amber-200/50' : 'w-1.5 bg-white/15'
                }`}
              />
            ))}
          </ol>

          <div className="flex items-center gap-2">
            <Button variant="ghost" size="sm" onClick={onOpenOverview}>목차 (O)</Button>
            <Button variant="ghost" size="sm" onClick={onToggleFullscreen}>
              {fullscreen ? '창 모드' : '전체화면 (F)'}
            </Button>
          </div>
        </div>
      );
    }

    function OverviewModal({ isOpen, onClose, index, onJump }) {
      return (
        <Modal isOpen={isOpen} onClose={onClose} title="전체 슬라이드" size="lg">
          <ul className="grid gap-2.5 sm:grid-cols-2 lg:grid-cols-3">
            {SLIDES.map((s, i) => {
              const a = ACCENTS[s.accent] || ACCENTS.amber;
              const isCurrent = i === index;
              return (
                <li key={i}>
                  <button
                    type="button"
                    onClick={() => { onJump(i); onClose(); }}
                    aria-current={isCurrent ? 'true' : undefined}
                    className={`flex w-full items-center gap-3 rounded-xl border px-4 py-3 text-left transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-300 ${
                      isCurrent
                        ? 'border-amber-300/60 bg-amber-300/15'
                        : 'border-white/10 bg-white/[0.04] hover:bg-white/[0.1]'
                    }`}
                  >
                    <span className="font-deco w-7 flex-none text-sm font-black tabular-nums text-amber-100/40">
                      {String(i + 1).padStart(2, '0')}
                    </span>
                    <span className={`h-1.5 w-1.5 flex-none rounded-full ${a.dot}`} aria-hidden="true" />
                    <span className="min-w-0 flex-1 truncate text-sm font-semibold text-amber-50">{s.label}</span>
                  </button>
                </li>
              );
            })}
          </ul>
        </Modal>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const deck = useDeck(SLIDES.length);
      const fullscreen = useFullscreen();
      const [overviewOpen, setOverviewOpen] = useState(false);
      const touchStartX = useRef(null);

      const slide = SLIDES[deck.index];

      // 키보드 내비게이션
      useEffect(() => {
        const onKey = e => {
          if (overviewOpen) return; // 모달이 열려 있으면 Escape 만 모달이 처리
          switch (e.key) {
            case 'ArrowRight':
            case ' ':
            case 'PageDown':
              e.preventDefault(); deck.next(); break;
            case 'ArrowLeft':
            case 'PageUp':
              e.preventDefault(); deck.prev(); break;
            case 'Home':
              e.preventDefault(); deck.goTo(0, 'prev'); break;
            case 'End':
              e.preventDefault(); deck.goTo(SLIDES.length - 1, 'next'); break;
            case 'o': case 'O': case 'ㅐ':
              e.preventDefault(); setOverviewOpen(true); break;
            case 'f': case 'F': case 'ㄹ':
              e.preventDefault(); fullscreen.toggle(); break;
            default: break;
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [deck.next, deck.prev, deck.goTo, fullscreen.toggle, overviewOpen]);

      // 모바일 스와이프
      const onTouchStart = useCallback(e => { touchStartX.current = e.changedTouches[0].clientX; }, []);
      const onTouchEnd = useCallback(e => {
        if (touchStartX.current === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX.current;
        if (Math.abs(dx) > 60) { dx < 0 ? deck.next() : deck.prev(); }
        touchStartX.current = null;
      }, [deck]);

      const jump = useCallback(i => deck.goTo(i), [deck]);

      const renderSlide = () => {
        switch (slide.kind) {
          case 'cover':       return <CoverSlide />;
          case 'toc':         return <TocSlide onJump={jump} />;
          case 'chapter':     return <ChapterSlide recipe={slide.recipe} />;
          case 'ingredients': return <IngredientsSlide recipe={slide.recipe} />;
          case 'steps':       return <StepsSlide recipe={slide.recipe} />;
          case 'secret':      return <SecretSlide recipe={slide.recipe} />;
          case 'finale':      return <FinaleSlide onRestart={() => deck.goTo(0, 'prev')} />;
          default:            return null;
        }
      };

      return (
        <div
          className="relative h-screen w-screen overflow-hidden"
          onTouchStart={onTouchStart}
          onTouchEnd={onTouchEnd}
        >
          <ProgressBar index={deck.index} total={SLIDES.length} accent={slide.accent} />

          <main className="absolute inset-0" aria-live="polite" aria-atomic="true">
            <SlideFrame accent={slide.accent} dir={deck.dir} slideKey={deck.index}>
              {renderSlide()}
            </SlideFrame>
          </main>

          {/* 좌우 클릭 영역 (컨트롤바 위쪽까지만) */}
          <button
            type="button" aria-label="이전 슬라이드" onClick={deck.prev} disabled={deck.index === 0}
            className="absolute left-0 top-0 z-20 h-[calc(100%-5rem)] w-[12%] cursor-w-resize opacity-0 disabled:cursor-default"
          />
          <button
            type="button" aria-label="다음 슬라이드" onClick={deck.next} disabled={deck.index === SLIDES.length - 1}
            className="absolute right-0 top-0 z-20 h-[calc(100%-5rem)] w-[12%] cursor-e-resize opacity-0 disabled:cursor-default"
          />

          <DeckControls
            index={deck.index}
            total={SLIDES.length}
            accent={slide.accent}
            onPrev={deck.prev}
            onNext={deck.next}
            onOpenOverview={() => setOverviewOpen(true)}
            fullscreen={fullscreen.active}
            onToggleFullscreen={fullscreen.toggle}
          />

          <OverviewModal
            isOpen={overviewOpen}
            onClose={() => setOverviewOpen(false)}
            index={deck.index}
            onJump={jump}
          />
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
