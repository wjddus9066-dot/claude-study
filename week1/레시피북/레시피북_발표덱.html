function FinaleSlide({ a }) {
  return (

      <Eyebrow a={a}>피날레</Eyebrow>

      <p className="mt-3 max-w-2xl text-sm leading-relaxed text-white/50">
        메뉴는 달라도 실패의 이유는 겹친다. 다섯 레시피의 진단표에서 반복된 원칙만 모았다.

function renderSlide(slide, go) {
  const a = ACCENTS[slide.accent];
  switch (slide.kind) {
    case 'cover':       return <CoverSlide a={a} />;
    case 'toc':         return <TocSlide a={a} go={go} />;
    case 'chapter':     return <ChapterSlide a={a} r={slide.recipe} />;
    case 'ingredients': return <IngredientsSlide a={a} r={slide.recipe} />;
    case 'steps':       return <StepsSlide a={a} r={slide.recipe} />;
    case 'secret':      return <SecretSlide a={a} r={slide.recipe} />;
    case 'finale':      return <FinaleSlide a={a} />;
    default:            return null;
  }
}

// ========================================
// 7. 목차 모달
// ========================================
function TocModal({ open, onClose, index, go }) {
  if (!open) return null;
  return (
    <div
      className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-6 backdrop-blur-sm"
      onClick={onClose}
      role="dialog"
      aria-modal="true"
      aria-label="전체 목차"
    >
      <div
        className="slide-scroll max-h-[80vh] w-full max-w-3xl overflow-y-auto rounded-3xl border border-white/12 bg-[#141009] p-6"
        onClick={e => e.stopPropagation()}
      >
        <div className="mb-4 flex items-center justify-between">
          <h3 className="font-title text-2xl text-white">전체 목차 <span className="text-sm text-white/40">{SLIDES.length}장</span></h3>
          <button onClick={onClose} className="rounded-lg border border-white/15 px-3 py-1 text-xs text-white/60 hover:bg-white/10">
            닫기 (Esc)
          </button>
        </div>
        <div className="grid gap-1.5 sm:grid-cols-2">
          {SLIDES.map((s, i) => {
            const sa = ACCENTS[s.accent];
            const cur = i === index;
            return (
              <button
                key={i}
                onClick={() => { go(i); onClose(); }}
                className={`flex items-center gap-3 rounded-xl px-3 py-2 text-left text-sm transition ${cur ? `${sa.soft} border ${sa.line} text-white` : 'border border-transparent text-white/60 hover:bg-white/5'}`}
              >
                <span className={`h-1.5 w-1.5 shrink-0 rounded-full ${sa.dot}`} />
                <span className="w-6 shrink-0 text-[11px] text-white/30">{i + 1}</span>
                <span className="truncate">{s.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ========================================
// 8. 앱 — 인덱스와 방향을 한 덩어리로 관리
// ========================================
function App() {
  const total = SLIDES.length;
  const [state, setState] = useState({ index: 0, dir: 'next' });
  const [tocOpen, setTocOpen] = useState(false);
  const touchX = useRef(null);

  const next = useCallback(() => setState(p => ({ index: Math.min(total - 1, p.index + 1), dir: 'next' })), [total]);
  const prev = useCallback(() => setState(p => ({ index: Math.max(0, p.index - 1), dir: 'prev' })), []);
  const go = useCallback((i) => setState(p => ({ index: Math.max(0, Math.min(total - 1, i)), dir: i >= p.index ? 'next' : 'prev' })), [total]);

  // 키보드 — 한글 자판(ㅐ=o, ㄹ=f)도 함께 받는다
  useEffect(() => {
    const onKey = (e) => {
      const k = e.key;
      if (k === 'Escape') { setTocOpen(false); return; }
      if (k === 'o' || k === 'O' || k === 'ㅐ') { e.preventDefault(); setTocOpen(v => !v); return; }
      if (k === 'f' || k === 'F' || k === 'ㄹ') {
        e.preventDefault();
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        return;
      }
      if (tocOpen) return;
      if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); next(); }
      else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
      else if (k === 'Home') { e.preventDefault(); go(0); }
      else if (k === 'End') { e.preventDefault(); go(total - 1); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [next, prev, go, total, tocOpen]);

  const onTouchStart = (e) => { touchX.current = e.changedTouches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
    touchX.current = null;
  };

  const slide = SLIDES[state.index];
  const a = ACCENTS[slide.accent];
  const pct = ((state.index + 1) / total) * 100;

  return (
    <div className="relative h-full w-full overflow-hidden" onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      <Backdrop a={a} />

      {/* 좌우 가장자리 클릭 영역 */}
      <button aria-label="이전 슬라이드" onClick={prev}
        className="absolute left-0 top-0 z-20 h-full w-[10%] cursor-w-resize opacity-0" />
      <button aria-label="다음 슬라이드" onClick={next}
        className="absolute right-0 top-0 z-20 h-full w-[10%] cursor-e-resize opacity-0" />

      {/* 현재 장만 렌더 — key 로 진입 애니메이션 재실행 */}
      <div key={state.index} className={`h-full w-full ${state.dir === 'next' ? 'enter-next' : 'enter-prev'}`}>
        {renderSlide(slide, go)}
      </div>

      {/* 하단 진행 바 */}
      <div className="absolute inset-x-0 bottom-0 z-30">
        <div className="h-[3px] w-full bg-white/8">
          <div className={`h-full transition-all duration-500 ${a.bar}`} style={{ width: `${pct}%` }} />
        </div>
        <div className="flex items-center justify-between px-5 py-3 text-[11px] text-white/40 sm:px-8">
          <span className="truncate">{slide.label}</span>
          <div className="flex items-center gap-4">
            <button onClick={() => setTocOpen(true)} className="rounded border border-white/12 px-2 py-0.5 hover:bg-white/10">
              목차 O
            </button>
            <span className="font-title text-white/60">{state.index + 1} / {total}</span>
          </div>
        </div>
      </div>

      <TocModal open={tocOpen} onClose={() => setTocOpen(false)} index={state.index} go={go} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
