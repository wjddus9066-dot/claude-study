function useCookTimer(total) {
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(false);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => {
      setElapsed(prev => {
        if (prev + 1 >= total) { setRunning(false); return total; }
        return prev + 1;
      });
    }, 1000);
    return () => clearInterval(id);   // cleanup 필수
  }, [running, total]);

  const start = useCallback(() => setRunning(true), []);
  const pause = useCallback(() => setRunning(false), []);
  const reset = useCallback(() => { setRunning(false); setElapsed(0); }, []);

  return { elapsed, running, done: elapsed >= total, start, pause, reset };
}

    const nextSet = new Set(prev);
    nextSet.has(key) ? nextSet.delete(key) : nextSet.add(key);
    return nextSet;

  return (
    <section id="ingredients" className="mx-auto max-w-5xl px-5 py-16 sm:px-6">
      <div className="flex flex-wrap items-end justify-between gap-4">
        <div>
          <div className="text-xs tracking-[0.3em] text-amber-700">재료</div>
          <h2 className="mt-2 font-title text-3xl text-stone-900">계량이 절반이다</h2>
        </div>
        <button
          onClick={() => setChecked(new Set())}
          className="rounded-full border border-stone-300 px-4 py-2 text-xs text-stone-500 transition hover:bg-white"
        >
          체크 초기화
        </button>
      </div>

      <div className="mt-5 rounded-2xl border border-stone-200 bg-white px-5 py-4">
        <div className="flex items-center justify-between text-sm">
          <span className="text-stone-500">준비한 재료</span>
          <span className="font-title text-stone-900">{checked.size} / {all.length}</span>
        </div>
        <div className="mt-2 h-2 w-full overflow-hidden rounded-full bg-stone-100">
          <div className="h-full rounded-full bg-amber-500 transition-all duration-300" style={{ width: `${pct}%` }} />
        </div>
      </div>

      <div className="mt-7 grid gap-5 md:grid-cols-2">
        {GROUPS.map(g => (
          <div key={g.name} className="rounded-2xl border border-stone-200 bg-white p-5">
            <div className={`text-xs tracking-[0.2em] ${g.optional ? 'text-stone-400' : 'text-amber-700'}`}>{g.name}</div>
            <ul className="mt-3 space-y-1.5">
              {g.items.map(it => {
                const key = `${g.name}/${it.n}`;
                const on = checked.has(key);
                return (
                  <li key={key}>
                    <button
                      onClick={() => toggle(key)}
                      aria-pressed={on}
                      className={`flex w-full items-start gap-3 rounded-xl px-3 py-2 text-left transition ${on ? 'bg-amber-50' : 'hover:bg-stone-50'}`}
                    >
                      <span className={`mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-md border text-[11px] ${
                        on ? 'border-amber-500 bg-amber-500 text-white' : 'border-stone-300 text-transparent'
                      }`}>✓</span>
                      <span className="flex-1">
                        <span className="flex flex-wrap items-baseline justify-between gap-x-3">
                          <span className={`font-title text-base ${on ? 'text-stone-400 line-through' : 'text-stone-900'}`}>{it.n}</span>
                          <span className={`text-sm ${on ? 'text-stone-300' : 'text-amber-700'}`}>{it.a}</span>
                        </span>
                        {it.note && <span className="mt-0.5 block text-[11px] leading-relaxed text-stone-400">{it.note}</span>}
                      </span>
                    </button>
                  </li>
                );
              })}
            </ul>
          </div>
        ))}
      </div>

      <div className="mt-6 grid gap-5 md:grid-cols-2">
        <div className="rounded-2xl border border-amber-200 bg-amber-50/70 p-6">
          <div className="text-xs tracking-[0.2em] text-amber-700">왜 이 재료인가</div>
          <h3 className="mt-2 font-title text-xl text-stone-900">{MAGIC.title}</h3>
          <p className="mt-3 text-sm leading-relaxed text-stone-600">{MAGIC.body}</p>
        </div>
        <div className="rounded-2xl border border-stone-200 bg-white p-6">
          <div className="text-xs tracking-[0.2em] text-stone-400">도구</div>
          <ul className="mt-3 space-y-2">
            {TOOLS.map(t => (
              <li key={t} className="flex gap-2 text-sm leading-relaxed text-stone-600">
                <span className="mt-2 h-1 w-1 shrink-0 rounded-full bg-amber-500" />
                <span>{t}</span>
              </li>
            ))}
          </ul>
        </div>
      </div>
    </section>
  );
}

// ========================================
// 6. 조리 타이머 — SVG 진행 링 + 단계 구간 바
// ========================================
function Timer({ timer, activeIndex }) {
  const { elapsed, running, done, start, pause, reset } = timer;
  const active = STEPS[activeIndex];
  const remainInStep = Math.max(0, active.end - elapsed);

  const R = 88;
  const C = 2 * Math.PI * R;
  const progress = Math.min(1, elapsed / TOTAL);

  return (
    <section id="timer" className="border-y border-stone-200 bg-white">
      <div className="mx-auto max-w-5xl px-5 py-16 sm:px-6">
        <div className="text-xs tracking-[0.3em] text-amber-700">조리 타이머</div>
        <h2 className="mt-2 font-title text-3xl text-stone-900">{RECIPE.time} 동안 무엇을 하고 있나</h2>

        <div className="mt-8 grid items-center gap-10 md:grid-cols-[auto,1fr]">
          <div className="relative mx-auto h-56 w-56 shrink-0">
            <svg viewBox="0 0 200 200" className="h-full w-full -rotate-90">
              <circle cx="100" cy="100" r={R} fill="none" stroke="#f5f0e6" strokeWidth="14" />
              <circle
                cx="100" cy="100" r={R} fill="none"
                stroke={done ? '#65a30d' : '#f59e0b'} strokeWidth="14" strokeLinecap="round"
                strokeDasharray={C} strokeDashoffset={C * (1 - progress)}
                className="transition-all duration-500"
              />
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <div className="font-title text-4xl text-stone-900">{fmt(elapsed)}</div>
              <div className="mt-1 text-xs text-stone-400">/ {fmt(TOTAL)}</div>
              {running && <div className="mt-2 h-1.5 w-1.5 rounded-full bg-amber-500 pulse-ring" />}
            </div>
          </div>

          <div>
            <div
              aria-live="polite"
              className={`rounded-2xl border p-5 ${done ? 'border-lime-300 bg-lime-50' : 'border-amber-200 bg-amber-50/70'}`}
            >
              {done ? (
                <>
                  <div className="font-title text-xl text-stone-900">완성 — 바로 먹는다</div>
                  <p className="mt-2 text-sm leading-relaxed text-stone-600">
                    무친 육회는 시간이 지날수록 물이 나온다. 담자마자 노른자를 터뜨려 육회와 먼저 섞는다.
                  </p>
                </>
              ) : (
                <>
                  <div className="text-xs tracking-[0.2em] text-amber-700">
                    STEP {activeIndex + 1} / {STEPS.length} · {active.time}
                  </div>
                  <div className="mt-1.5 font-title text-xl text-stone-900">{active.label}</div>
                  <p className="mt-2 text-sm leading-relaxed text-stone-600">{active.body[0]}</p>
                  <div className="mt-3 text-sm text-stone-500">
                    이 단계 남은 시간 <span className="font-title text-base text-stone-900">{fmt(remainInStep)}</span>
                  </div>
                </>
              )}
            </div>

            <div className="mt-4 flex flex-wrap gap-2">
              {!running && !done && (
                <button onClick={start} className="rounded-full bg-amber-500 px-6 py-2.5 text-sm text-white transition hover:bg-amber-600">
                  {elapsed > 0 ? '이어서' : '시작'}
                </button>
              )}
              {running && (
                <button onClick={pause} className="rounded-full bg-stone-900 px-6 py-2.5 text-sm text-white transition hover:bg-stone-700">
                  일시정지
                </button>
              )}
              <button onClick={reset} className="rounded-full border border-stone-300 px-6 py-2.5 text-sm text-stone-600 transition hover:bg-stone-50">
                초기화
              </button>
            </div>

            {/* 단계별 구간 바 — 각 단계 소요 시간에 비례 */}
            <div className="mt-6">
              <div className="flex h-3 w-full gap-0.5 overflow-hidden rounded-full bg-stone-100">
                {STEPS.map((s, i) => {
                  const w = ((s.end - s.start) / TOTAL) * 100;
                  const passed = elapsed >= s.end;
                  const current = i === activeIndex && !done;
                  return (
                    <div
                      key={i}
                      title={`${s.time} ${s.label}`}
                      style={{ width: `${w}%` }}
                      className={`h-full transition-colors ${
                        passed ? 'bg-amber-400' : current ? 'bg-amber-500' : 'bg-stone-200'
                      }`}
                    />
                  );
                })}
              </div>
              <div className="mt-2 flex justify-between text-[10px] text-stone-400">
                <span>0:00</span><span>{fmt(TOTAL)}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

// ========================================
// 7. 만드는 법 — 타이머와 연동해 현재 단계 강조
// ========================================
function Steps({ activeIndex, running }) {
  const [doneSet, setDoneSet] = useState(() => new Set());
  const toggle = (i) => setDoneSet(prev => {
    const n = new Set(prev);
    n.has(i) ? n.delete(i) : n.add(i);
    return n;
  });

  return (
    <section id="steps" className="mx-auto max-w-5xl px-5 py-16 sm:px-6">
      <div className="text-xs tracking-[0.3em] text-amber-700">만드는 법</div>
      <h2 className="mt-2 font-title text-3xl text-stone-900">순서를 지키면 양념은 단순해도 된다</h2>

      <ol className="mt-8 space-y-4">
        {STEPS.map((s, i) => {
          const isActive = running && i === activeIndex;
          const isDone = doneSet.has(i);
          return (
            <li
              key={i}
              className={`rounded-2xl border bg-white p-5 transition ${
                isActive ? 'border-amber-400 ring-2 ring-amber-300/60' : 'border-stone-200'
              } ${isDone ? 'opacity-60' : ''}`}
            >
              <div className="flex items-start gap-4">
                <button
                  onClick={() => toggle(i)}
                  aria-pressed={isDone}
                  aria-label={`${i + 1}단계 완료 표시`}
                  className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-full border font-title text-sm transition ${
                    isDone
                      ? 'border-amber-500 bg-amber-500 text-white'
                      : 'border-stone-300 text-stone-500 hover:border-amber-400 hover:text-amber-600'
                  }`}
                >
                  {isDone ? '✓' : i + 1}
                </button>
                <div className="flex-1">
                  <div className="flex flex-wrap items-baseline gap-3">
                    <h3 className={`font-title text-lg ${isDone ? 'text-stone-400 line-through' : 'text-stone-900'}`}>{s.label}</h3>
                    <span className="rounded-md bg-stone-100 px-2 py-0.5 text-[11px] text-stone-500">{s.time}</span>
                    {s.core && <span className="rounded-md bg-amber-100 px-2 py-0.5 text-[11px] text-amber-700">핵심</span>}
                    {isActive && <span className="rounded-md bg-amber-500 px-2 py-0.5 text-[11px] text-white">진행 중</span>}
                  </div>
                  <ul className="mt-2.5 space-y-1.5">
                    {s.body.map((b, j) => (
                      <li key={j} className="flex gap-2 text-sm leading-relaxed text-stone-600">
                        <span className="mt-2 h-1 w-1 shrink-0 rounded-full bg-amber-400" />
                        <span>{b}</span>
                      </li>
                    ))}
                  </ul>
                  {s.note && (
                    <div className={`mt-3 rounded-xl border p-4 ${
                      s.note.kind === 'safety' ? 'border-rose-200 bg-rose-50/70' : 'border-amber-200 bg-amber-50/70'
                    }`}>
                      <div className={`text-[11px] tracking-[0.2em] ${s.note.kind === 'safety' ? 'text-rose-700' : 'text-amber-700'}`}>
                        {s.note.kind === 'safety' ? '생고기 취급 주의' : (s.note.title || '원리')}
                      </div>
                      <p className="mt-1.5 text-sm leading-relaxed text-stone-600">{s.note.body}</p>
                    </div>
                  )}
                </div>
              </div>
            </li>
          );
        })}

        <li className="rounded-2xl border border-dashed border-stone-300 bg-white/60 p-5">
          <div className="flex items-start gap-4">
            <span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-stone-300 text-lg">🥢</span>
            <div>
              <h3 className="font-title text-lg text-stone-900">{FINAL_STEP.label}</h3>
              <ul className="mt-2.5 space-y-1.5">
                {FINAL_STEP.body.map((b, j) => (
                  <li key={j} className="flex gap-2 text-sm leading-relaxed text-stone-600">
                    <span className="mt-2 h-1 w-1 shrink-0 rounded-full bg-amber-400" />
                    <span>{b}</span>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </li>
      </ol>
    </section>
  );
}

// ========================================
// 8. 실패 진단표 — 아코디언
// ========================================
function Troubles() {
  const [open, setOpen] = useState(null);
  return (
    <section id="trouble" className="border-y border-stone-200 bg-white">
      <div className="mx-auto max-w-5xl px-5 py-16 sm:px-6">
        <div className="text-xs tracking-[0.3em] text-amber-700">실패 진단표</div>
        <h2 className="mt-2 font-title text-3xl text-stone-900">증상부터 찾는다</h2>

        <div className="mt-7 divide-y divide-stone-200 rounded-2xl border border-stone-200">
          {TROUBLES.map((t, i) => {
            const on = open === i;
            return (
              <div key={t.s}>
                <button
                  onClick={() => setOpen(on ? null : i)}
                  aria-expanded={on}
                  className="flex w-full items-center justify-between gap-4 px-5 py-4 text-left transition hover:bg-amber-50/60"
                >
                  <span className="font-title text-base text-stone-900">{t.s}</span>
                  <span className={`shrink-0 text-stone-400 transition-transform ${on ? 'rotate-45' : ''}`}>＋</span>
                </button>
                {on && (
                  <div className="px-5 pb-5">
                    <div className="rounded-xl bg-stone-50 p-4">
                      <div className="text-xs text-stone-400">원인</div>
                      <div className="mt-1 text-sm text-stone-600">{t.c}</div>
                      <div className="mt-3 border-t border-stone-200 pt-3 text-xs text-amber-700">해결</div>
                      <div className="mt-1 text-sm text-stone-800">{t.f}</div>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
}

// ========================================
// 9. 응용 · 재료 대체 · 보관
// ========================================
function Extra() {
  return (
    <section id="extra" className="mx-auto max-w-5xl px-5 py-16 sm:px-6">
      <div className="text-xs tracking-[0.3em] text-amber-700">응용 · 재료 대체 · 보관</div>
      <h2 className="mt-2 font-title text-3xl text-stone-900">한 번 익히면 여러 갈래</h2>

      <div className="mt-8 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        {VARIATIONS.map(v => (
          <div key={v.title} className="rounded-2xl border border-stone-200 bg-white p-5">
            <div className="font-title text-base text-stone-900">{v.title}</div>
            <p className="mt-1.5 text-sm leading-relaxed text-stone-600">{v.body}</p>
          </div>
        ))}
      </div>

      <div className="mt-10 grid gap-6 md:grid-cols-2">
        <div className="overflow-hidden rounded-2xl border border-stone-200 bg-white">
          <div className="border-b border-stone-200 px-5 py-3 text-xs tracking-[0.2em] text-stone-400">재료 대체</div>
          <table className="w-full text-left text-sm">
            <tbody className="divide-y divide-stone-100">
              {SUBSTITUTES.map(s => (
                <tr key={s.m}>
                  <td className="w-32 px-5 py-3 font-title text-stone-900">{s.m}</td>
                  <td className="px-5 py-3 text-stone-600">{s.i}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="rounded-2xl border border-amber-200 bg-amber-50/70 p-6">
          <div className="text-xs tracking-[0.2em] text-amber-700">보관</div>
          <p className="mt-3 text-sm leading-relaxed text-stone-700">{STORAGE}</p>
        </div>
      </div>

      <footer className="mt-14 border-t border-stone-200 pt-6 text-xs text-stone-400">
        2주차 · 레시피북 01 — 원문: 01-육회비빔밥.md
      </footer>
    </section>
  );
}

// ========================================
// 10. 앱
// ========================================
function App() {
  const timer = useCookTimer(TOTAL);
  const { elapsed, running } = timer;

  const activeIndex = useMemo(() => {
    const i = STEPS.findIndex(s => elapsed >= s.start && elapsed < s.end);
    return i === -1 ? STEPS.length - 1 : i;
  }, [elapsed]);

  const [activeSection, setActiveSection] = useState('ingredients');

  useEffect(() => {
    const els = NAV.map(n => document.getElementById(n.id)).filter(Boolean);
    const io = new IntersectionObserver(
      entries => {
        const visible = entries.filter(e => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (visible[0]) setActiveSection(visible[0].target.id);
      },
      { rootMargin: '-80px 0px -55% 0px', threshold: [0.05, 0.25, 0.5] }
    );
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <div>
      <Hero />
      <TopNav active={activeSection} />
      <Ingredients />
      <Timer timer={timer} activeIndex={activeIndex} />
      <Steps activeIndex={activeIndex} running={running} />
      <Troubles />
      <Extra />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
