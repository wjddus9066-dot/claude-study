<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>납부지연가산세 계산기</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp .3s ease-out both; }
    .tabular { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    // ========================================================================
    // ⚙️ 세율·기준 상수 — 법 개정 시 이 블록만 고치면 된다
    // ========================================================================

    /**
     * 일할 이자율 연혁 (국세기본법 시행령 제27조의4)
     * 개정 부칙상 "시행일 이후 기간분"부터 새 세율이 적용되므로,
     * 체납 기간을 구간별로 잘라 각각 계산해야 한다.
     */
    const RATE_TABLE = [
      {
        from: '1900-01-01', to: '2019-02-11',
        rate: 0.0003,    // 1일 10,000분의 3
        label: '1일 10,000분의 3', pct: '0.030%', annual: '연 10.95%',
        periodText: '~ 2019.2.11.', note: '종전 세율',
      },
      {
        from: '2019-02-12', to: '2022-02-14',
        rate: 0.00025,   // 1일 100,000분의 25
        label: '1일 100,000분의 25', pct: '0.025%', annual: '연 9.125%',
        periodText: '2019.2.12. ~ 2022.2.14.', note: '2019.2.12. 인하',
      },
      {
        from: '2022-02-15', to: '2999-12-31',
        rate: 0.00022,   // 1일 100,000분의 22
        label: '1일 100,000분의 22', pct: '0.022%', annual: '연 8.03%',
        periodText: '2022.2.15. ~', note: '2022.2.15. 인하',
      },
    ];

    /**
     * 2026.7.1. 시행 — 체납 이후 산출 단위의 월 단위 전환
     * (국세기본법 제47조의4·제47조의5 개정)
     *
     * 국세청 안내문 확인 내용:
     *   - 현행 (체납시 3%, 일 0.022%) → 개정 (체납시 3%, 월 0.67%)
     *   - "지정납부기한이 경과한 이후부터 납부일까지" 발생하는 가산세의
     *     산출 단위가 일(日) → 매 1개월(月) 경과 시마다로 변경
     *   - 즉 3% 정률분과 고지 전 일할 구간은 종전과 동일하고,
     *     바뀌는 것은 '체납 이후' 구간뿐이다
     *   - 독촉장 송달비용(등기우편)이 납부지연가산세에 포함되며,
     *     독촉장을 우편 발송할 때마다 가산된다
     *
     * 남은 확인 사항:
     *   - maxMonths: 종전 5년 한도를 개월로 환산한 값(가정). 조문 확인 필요
     *   - 적용 대상 판정을 '고지서 발급일' 기준으로 두었다. 부칙이
     *     '시행 이후 지정납부기한이 경과하는 분' 등으로 정했다면 조정 필요
     */
    const MONTHLY_REGIME = {
      effectiveFrom: '2026-07-01',  // 이 날 이후 '발급된 고지서'부터 적용
      monthlyRate: 0.0067,          // 매 1개월 경과 시 미납세액의 0.67%
      maxMonths: 60,                // 최대 60개월 (⚠️ 조문 확인 필요)
      pct: '0.67%',
      annual: '연 8.04%',
    };

    /**
     * 독촉장 송달비용 — 등기우편으로 독촉장을 발송할 때마다 가산세에 포함된다.
     * 등기우편 요금은 규격·중량에 따라 다르므로 단가를 직접 입력받는다.
     * 전자송달을 신청하면 이 비용이 발생하지 않는다.
     */
    const DEFAULT_REGISTERED_MAIL_COST = 3000;

    /** 납부고지서상 납부기한까지 미납 시 한 번 가산되는 정률분 */
    const NOTICE_SURCHARGE_RATE = 0.03;

    /** 원천징수 등 납부지연가산세 (국세기본법 제47조의5) */
    const WITHHOLDING = {
      flatRate: 0.03,      // 자진납부·수정신고 여부와 무관하게 무조건 부과
      capBeforeNotice: 0.10, // 3% + (법정기한 다음 날 ~ 고지일) 일할분의 합계 한도
      capTotal: 0.50,        // 가산세 총액 한도
    };

    /** 납부고지서별·세목별 세액이 이 금액 미만이면 고지 이후 가산세가 붙지 않는다 */
    const SMALL_AMOUNT_THRESHOLD = 1500000;

    /** (일할 방식) 고지서 납부기한 다음 날부터 가산세를 매기는 최대 기간 */
    const MAX_INTEREST_YEARS = 5;

    // ========================================
    // 🛠️ Utilities
    // ========================================

    const DAY_MS = 86400000;

    function parseDateOnly(iso) {
      const [y, m, d] = (iso || '').split('-').map(Number);
      if (!y || !m || !d) return null;
      const dt = new Date(y, m - 1, d, 0, 0, 0, 0);
      if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
      return dt;
    }

    function toISODate(date) {
      const p = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
    }

    function todayMidnight() {
      const n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0, 0, 0, 0);
    }

    const addDays  = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 0, 0, 0, 0);
    const addYears = (d, n) => new Date(d.getFullYear() + n, d.getMonth(), d.getDate(), 0, 0, 0, 0);

    /** 말일 보정을 포함한 개월 더하기 (1/31 + 1개월 = 2/28) */
    function addMonths(d, n) {
      const anchor = new Date(d.getFullYear(), d.getMonth() + n, 1, 0, 0, 0, 0);
      const lastDay = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0).getDate();
      return new Date(anchor.getFullYear(), anchor.getMonth(), Math.min(d.getDate(), lastDay), 0, 0, 0, 0);
    }

    /** from 으로부터 to 까지 '만 경과한' 개월 수 */
    function monthsElapsed(from, to) {
      if (to.getTime() < from.getTime()) return 0;
      let count = 0;
      while (count < 1200) {
        if (addMonths(from, count + 1).getTime() <= to.getTime()) count += 1;
        else break;
      }
      return count;
    }

    /** 시작일·종료일을 모두 포함한 일수 */
    const inclusiveDays = (start, end) => Math.round((end.getTime() - start.getTime()) / DAY_MS) + 1;

    const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const fmtDate = (d) => `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}.`;
    const fmtDateFull = (d) => `${fmtDate(d)} (${WEEKDAYS[d.getDay()]})`;

    const nf = new Intl.NumberFormat('ko-KR');
    const won = (n) => `${nf.format(Math.round(n))}원`;

    const onlyDigits = (s) => (s || '').replace(/[^\d]/g, '');

    /** 가산세는 원 단위 미만 절사 */
    const truncWon = (n) => Math.floor(n);

    /**
     * 한 구간(start~end, 양끝 포함)을 세율 개정 시점 기준으로 쪼개어 계산한다.
     * @returns {{segments: Array, total: number, days: number}}
     */
    function calcInterestBySegment(start, end, unpaid, groupLabel) {
      const segments = [];
      let total = 0;
      let days = 0;

      if (!start || !end || start.getTime() > end.getTime()) return { segments, total, days };

      for (const band of RATE_TABLE) {
        const bandFrom = parseDateOnly(band.from);
        const bandTo = parseDateOnly(band.to);

        // 체납 기간과 세율 구간의 교집합
        const segStart = start.getTime() > bandFrom.getTime() ? start : bandFrom;
        const segEnd = end.getTime() < bandTo.getTime() ? end : bandTo;
        if (segStart.getTime() > segEnd.getTime()) continue;

        const segDays = inclusiveDays(segStart, segEnd);
        const amount = unpaid * band.rate * segDays;

        segments.push({
          key: `${groupLabel}-${band.from}`,
          groupLabel, pct: band.pct,
          from: segStart, to: segEnd, days: segDays, amount,
        });

        total += amount;
        days += segDays;
      }

      return { segments, total, days };
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-1.5 rounded-xl font-semibold transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:opacity-40 disabled:cursor-not-allowed';
      const variants = {
        primary:   'bg-slate-900 text-white hover:bg-slate-700 active:scale-[.98] focus-visible:ring-slate-900',
        secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 active:scale-[.98] focus-visible:ring-slate-400',
        danger:    'bg-rose-600 text-white hover:bg-rose-700 active:scale-[.98] focus-visible:ring-rose-500',
        ghost:     'bg-transparent text-slate-500 hover:bg-slate-100 hover:text-slate-900 focus-visible:ring-slate-300',
      };
      const sizes = { sm: 'px-2.5 py-1.5 text-xs', md: 'px-4 py-2.5 text-sm', lg: 'px-6 py-3 text-base' };
      return (
        <button type={type} onClick={onClick} disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, hint, suffix, disabled = false, id, className = '', ...rest }) {
      const autoId = useRef(`in-${Math.random().toString(36).slice(2, 8)}`).current;
      const inputId = id || autoId;
      return (
        <div className={className}>
          {label && <label htmlFor={inputId} className="mb-1.5 block text-sm font-semibold text-slate-700">{label}</label>}
          <div className="relative">
            <input
              id={inputId} type={type} value={value} onChange={onChange}
              placeholder={placeholder} disabled={disabled}
              aria-invalid={error ? 'true' : 'false'}
              className={`w-full rounded-xl border bg-white py-3 pl-3.5 text-base text-slate-900 placeholder-slate-400 transition-colors focus:outline-none focus:ring-2 disabled:bg-slate-100 disabled:text-slate-400 ${suffix ? 'pr-12' : 'pr-3.5'} ${
                error ? 'border-rose-400 focus:border-rose-500 focus:ring-rose-200'
                      : 'border-slate-300 focus:border-slate-900 focus:ring-slate-200'
              }`}
              {...rest}
            />
            {suffix && (
              <span className="pointer-events-none absolute right-3.5 top-1/2 -translate-y-1/2 text-sm font-medium text-slate-400">
                {suffix}
              </span>
            )}
          </div>
          {error ? <p className="mt-1.5 text-xs font-medium text-rose-600">{error}</p>
                 : hint && <p className="mt-1.5 text-xs text-slate-500">{hint}</p>}
        </div>
      );
    }

    /**
     * tone 으로 배경/글자색을 정하고 className 은 여백·배치에만 쓴다.
     * 배경 클래스가 항상 하나만 존재하므로 색이 겹쳐 글자가 묻히는 일이 없다.
     */
    function Card({ tone = 'light', className = '', children, ...rest }) {
      const tones = {
        light: 'border-slate-200 bg-white text-slate-900',
        muted: 'border-slate-200 bg-slate-50 text-slate-900',
        good:  'border-emerald-300 bg-emerald-50 text-emerald-900',
        warn:  'border-amber-300 bg-amber-50 text-amber-900',
        bad:   'border-rose-300 bg-rose-50 text-rose-900',
        info:  'border-indigo-300 bg-indigo-50 text-indigo-900',
      };
      return (
        <div className={`rounded-2xl border p-5 shadow-sm ${tones[tone]} ${className}`} {...rest}>
          {children}
        </div>
      );
    }

    function Badge({ tone = 'neutral', className = '', children }) {
      const tones = {
        neutral: 'bg-slate-200 text-slate-700',
        dark:    'bg-slate-900 text-white',
        good:    'bg-emerald-600 text-white',
        warn:    'bg-amber-500 text-white',
        bad:     'bg-rose-600 text-white',
        info:    'bg-indigo-600 text-white',
      };
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold ${tones[tone]} ${className}`}>
          {children}
        </span>
      );
    }

    function Checkbox({ checked, onChange, label, description, disabled = false, id }) {
      const autoId = useRef(`cb-${Math.random().toString(36).slice(2, 8)}`).current;
      const cbId = id || autoId;
      return (
        <label htmlFor={cbId}
          className={`flex items-start gap-3 rounded-xl border border-slate-200 p-3 transition-colors ${
            disabled ? 'cursor-not-allowed opacity-50' : 'cursor-pointer hover:bg-slate-50'
          }`}>
          <input
            id={cbId} type="checkbox" checked={checked} disabled={disabled}
            onChange={(e) => onChange(e.target.checked)}
            className="mt-0.5 h-4 w-4 shrink-0 rounded border-slate-300 text-slate-900 focus:ring-2 focus:ring-slate-400"
          />
          <span className="min-w-0">
            <span className="block text-sm font-semibold text-slate-800">{label}</span>
            {description && <span className="mt-0.5 block text-xs leading-snug text-slate-500">{description}</span>}
          </span>
        </label>
      );
    }

    function SegmentedControl({ value, onChange, options, ariaLabel }) {
      return (
        <div className="flex gap-1.5 rounded-xl border border-slate-300 bg-slate-100 p-1" role="tablist" aria-label={ariaLabel}>
          {options.map(opt => (
            <button
              key={opt.value} role="tab" aria-selected={value === opt.value}
              onClick={() => onChange(opt.value)}
              className={`flex-1 rounded-lg px-2.5 py-2.5 text-sm font-bold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 ${
                value === opt.value ? 'bg-slate-900 text-white shadow' : 'bg-transparent text-slate-600 hover:text-slate-900'
              }`}
            >
              {opt.label}
              <span className="mt-0.5 block text-[11px] font-medium leading-tight opacity-70">{opt.sub}</span>
            </button>
          ))}
        </div>
      );
    }

    // ========================================
    // 🧮 계산 로직
    // ========================================

    /**
     * 납부지연가산세를 계산한다.
     * 세목(일반 국세 / 원천세)과 납부 유형(자진납부분 / 고지분),
     * 그리고 고지서 발급일에 따른 일할·월할 방식을 모두 반영한다.
     */
    function computePenalty(input) {
      const {
        taxKind, mode, unpaid,
        dueDate, payDate, noticeDate, noticeDueDate,
        demandCost, applyFiveYearCap, applySmallAmountRule,
      } = input;

      const due = parseDateOnly(dueDate);
      const pay = parseDateOnly(payDate);
      const isNotice = mode === 'notice';
      const isWithholding = taxKind === 'withholding';

      if (!unpaid || unpaid <= 0) return { error: '미납세액을 입력해 주세요.' };
      if (!due) return { error: '법정납부기한을 올바르게 입력해 주세요.' };
      if (!pay) return { error: '납부(예정)일을 올바르게 입력해 주세요.' };
      if (pay.getTime() <= due.getTime()) {
        return { error: '납부일이 법정납부기한 이내입니다. 납부지연가산세가 발생하지 않습니다.', benign: true };
      }

      // 가산세 기산일 = 법정납부기한의 다음 날
      const start = addDays(due, 1);
      const lines = [];
      const notes = [];

      // ── 1) 원천세는 자진납부·고지 여부와 무관하게 3% 정률이 먼저 붙는다 ──
      let withholdingFlat = 0;
      if (isWithholding) {
        withholdingFlat = unpaid * WITHHOLDING.flatRate;
        lines.push({
          key: 'wh-flat',
          label: '원천세 3% 정률',
          note: `${won(unpaid)} × 3% · 자진납부·수정신고여도 부과`,
          amount: withholdingFlat,
        });
      }

      // ── 2) 자진납부분: 기한 다음 날 ~ 납부일까지 일할 ──
      if (!isNotice) {
        const interest = calcInterestBySegment(start, pay, unpaid, '법정기한 후');
        lines.push({
          key: 'self-daily',
          label: '법정기한 후 ~ 납부일 (일할)',
          note: `${fmtDate(start)} → ${fmtDate(pay)} · ${nf.format(interest.days)}일`,
          amount: interest.total,
          segments: interest.segments,
        });

        return finalize({
          lines, notes, unpaid, isWithholding, demandCost: 0,
          beforeNoticeKeys: ['wh-flat', 'self-daily'],
          meta: {
            taxKind, mode, due, pay, start,
            totalDays: inclusiveDays(start, pay),
            interestDays: interest.days,
            regime: 'daily',
            segments: interest.segments,
          },
        });
      }

      // ── 3) 고지분 ──
      const notice = parseDateOnly(noticeDate);
      const noticeDue = parseDateOnly(noticeDueDate);

      if (!notice) return { error: '납부고지일을 올바르게 입력해 주세요.' };
      if (!noticeDue) return { error: '지정납부기한을 올바르게 입력해 주세요.' };
      if (notice.getTime() <= due.getTime()) return { error: '납부고지일은 법정납부기한보다 뒤여야 합니다.' };
      if (noticeDue.getTime() < notice.getTime()) return { error: '지정납부기한은 납부고지일보다 뒤여야 합니다.' };
      if (pay.getTime() < notice.getTime()) return { error: '납부일이 납부고지일보다 앞섭니다. 자진납부분으로 계산하세요.' };

      // 고지서 발급일이 시행일 이후면 월 단위 방식이 적용된다
      const reformFrom = parseDateOnly(MONTHLY_REGIME.effectiveFrom);
      const regime = notice.getTime() >= reformFrom.getTime() ? 'monthly' : 'daily';

      // 소액 면제: 고지 이후분만 빠지고, 고지 전 일할분은 그대로 부과된다
      const smallAmountExempt = applySmallAmountRule && unpaid < SMALL_AMOUNT_THRESHOLD;

      // ① 법정납부기한 다음 날 ~ 납부고지일 (일할) — 두 방식 모두 동일
      const stage1 = calcInterestBySegment(start, notice, unpaid, '① 고지 전');
      lines.push({
        key: 'stage1',
        label: '① 법정기한 후 ~ 고지일 (일할)',
        note: `${fmtDate(start)} → ${fmtDate(notice)} · ${nf.format(stage1.days)}일`,
        amount: stage1.total,
        segments: stage1.segments,
      });

      const paidWithinNoticeDue = pay.getTime() <= noticeDue.getTime();

      // ② 지정납부기한까지 미납 시 3% 정률 (원천세는 이미 3%가 붙었으므로 중복 부과하지 않는다)
      let surcharge = 0;
      if (!paidWithinNoticeDue && !smallAmountExempt && !isWithholding) {
        surcharge = unpaid * NOTICE_SURCHARGE_RATE;
      }
      lines.push({
        key: 'surcharge',
        label: '② 지정납부기한까지 미납 (3% 정률)',
        note: isWithholding ? '원천세 3% 정률로 이미 반영'
            : smallAmountExempt ? '150만원 미만이라 미적용'
            : paidWithinNoticeDue ? '지정납부기한 내 납부라 미적용'
            : `${won(unpaid)} × 3%`,
        amount: surcharge,
      });

      // ③ 지정납부기한 다음 날 ~ 납부일
      let stage3Amount = 0;
      let stage3Note = '';
      let stage3Segments = null;
      let stage3Days = 0;
      let stage3Months = 0;
      let cappedByMonths = false;
      let cappedByYears = false;
      let capDate = null;
      let stage3Start = null;
      let stage3End = null;

      if (paidWithinNoticeDue) {
        stage3Note = '지정납부기한 내 납부라 미적용';
      } else if (smallAmountExempt) {
        stage3Note = '150만원 미만이라 미적용';
      } else if (regime === 'monthly') {
        // 월 단위: 지정납부기한 다음 날부터 1개월 경과할 때마다 정률 부과
        stage3Start = addDays(noticeDue, 1);
        const rawMonths = monthsElapsed(noticeDue, pay);
        stage3Months = Math.min(rawMonths, MONTHLY_REGIME.maxMonths);
        cappedByMonths = rawMonths > MONTHLY_REGIME.maxMonths;
        stage3End = stage3Months > 0 ? addMonths(noticeDue, stage3Months) : noticeDue;
        stage3Amount = unpaid * MONTHLY_REGIME.monthlyRate * stage3Months;
        stage3Note = stage3Months === 0
          ? '1개월 미경과 — 아직 부과되지 않음'
          : `${stage3Months}개월 경과 × ${MONTHLY_REGIME.pct}${cappedByMonths ? ` (${MONTHLY_REGIME.maxMonths}개월 한도)` : ''}`;
      } else {
        // 일할 방식 (종전)
        stage3Start = addDays(noticeDue, 1);
        capDate = addDays(addYears(stage3Start, MAX_INTEREST_YEARS), -1);
        cappedByYears = applyFiveYearCap && pay.getTime() > capDate.getTime();
        stage3End = cappedByYears ? capDate : pay;
        const s3 = calcInterestBySegment(stage3Start, stage3End, unpaid, '③ 고지기한 후');
        stage3Amount = s3.total;
        stage3Segments = s3.segments;
        stage3Days = s3.days;
        stage3Note = `${fmtDate(stage3Start)} → ${fmtDate(stage3End)} · ${nf.format(s3.days)}일`;
      }

      lines.push({
        key: 'stage3',
        label: regime === 'monthly'
          ? `③ 지정납부기한 후 (월할 ${MONTHLY_REGIME.pct}/월)`
          : '③ 지정납부기한 후 (일할)',
        note: stage3Note,
        amount: stage3Amount,
        segments: stage3Segments,
      });

      // ④ 독촉비용 — 월 단위 방식에서 가산세와 함께 징수된다
      const cost = regime === 'monthly' && !paidWithinNoticeDue ? (demandCost || 0) : 0;
      if (regime === 'monthly') {
        lines.push({
          key: 'demand-cost',
          label: '④ 독촉비용',
          note: cost > 0 ? '고지서에 기재된 실제 금액' : '입력값 없음',
          amount: cost,
          isCost: true,
        });
      }

      return finalize({
        lines, notes, unpaid, isWithholding, demandCost: cost,
        beforeNoticeKeys: ['wh-flat', 'stage1'],
        meta: {
          taxKind, mode, due, pay, start, notice, noticeDue,
          regime, paidWithinNoticeDue, smallAmountExempt,
          cappedByMonths, cappedByYears, capDate,
          stage3Start, stage3End, stage3Months,
          interestDays: stage1.days + stage3Days,
          totalDays: inclusiveDays(start, pay),
          segments: [...stage1.segments, ...(stage3Segments || [])],
        },
      });
    }

    /**
     * 원천세 한도(10% / 50%)를 적용하고 합계를 낸다.
     * 독촉비용은 가산세가 아니므로 한도 계산에서 제외한다.
     */
    function finalize({ lines, notes, unpaid, isWithholding, demandCost, beforeNoticeKeys, meta }) {
      const amountOf = (key) => {
        const l = lines.find(x => x.key === key);
        return l ? l.amount : 0;
      };

      let penaltyLines = lines.filter(l => !l.isCost);
      let rawPenalty = penaltyLines.reduce((a, l) => a + l.amount, 0);
      let capNote = null;
      let capBeforeApplied = false;
      let capTotalApplied = false;
      let penaltyTotal = rawPenalty;

      if (isWithholding) {
        // 한도 1: 3% + 고지 전 일할분 ≤ 미납세액 × 10%
        const beforeSum = beforeNoticeKeys.reduce((a, k) => a + amountOf(k), 0);
        const capBefore = unpaid * WITHHOLDING.capBeforeNotice;
        let adjust = 0;
        if (beforeSum > capBefore) {
          adjust = beforeSum - capBefore;
          capBeforeApplied = true;
        }
        penaltyTotal = rawPenalty - adjust;

        // 한도 2: 가산세 총액 ≤ 미납세액 × 50%
        const capTotal = unpaid * WITHHOLDING.capTotal;
        if (penaltyTotal > capTotal) {
          penaltyTotal = capTotal;
          capTotalApplied = true;
        }

        if (capBeforeApplied || capTotalApplied) {
          capNote = capTotalApplied
            ? `총액 한도 50%(${won(capTotal)})가 적용되었습니다.`
            : `3% + 고지 전 일할분에 10% 한도(${won(capBefore)})가 적용되었습니다.`;
        }
      }

      const penalty = truncWon(penaltyTotal);
      const cost = truncWon(demandCost);

      return {
        lines,
        notes,
        ...meta,
        rawPenalty: truncWon(rawPenalty),
        penaltyTotal: penalty,
        demandCost: cost,
        capBeforeApplied,
        capTotalApplied,
        capNote,
        grandTotal: unpaid + penalty + cost,
        effectiveRate: (penalty / unpaid) * 100,
      };
    }

                  <Input
                    type="date" label="납부고지일 (고지서 발급일)" value={noticeDate}
                    onChange={(e) => setNoticeDate(e.target.value)}
                    hint={`${MONTHLY_REGIME.effectiveFrom.replace(/-/g, '.')} 이후면 월 단위 적용`}
                  />
                  <Input
                    type="date" label="지정납부기한 (고지서상 기한)" value={noticeDueDate}
                    onChange={(e) => setNoticeDueDate(e.target.value)}
                    hint="이 날 이후부터 ③ 구간 기산"
                  />
                </>
              )}
              <Input
                type="date" label="실제 납부(예정)일" value={payDate}
                onChange={(e) => setPayDate(e.target.value)}
                hint="이 날까지 포함해 계산"
              />
            </div>

            {isMonthly && (
              <div className="mt-4">
                <Input
                  label="독촉비용" value={demandCostInput ? nf.format(Number(demandCostInput)) : ''}
                  onChange={(e) => setDemandCostInput(onlyDigits(e.target.value).slice(0, 12))}
                  placeholder="0" suffix="원" inputMode="numeric"
                  hint="월 단위 방식에서는 독촉비용이 함께 징수됩니다. 고지서상 실제 금액을 입력하세요."
                />
              </div>
            )}

            <div className="mt-4 space-y-2">
              <Checkbox
                checked={applySmallAmountRule && isNotice}
                onChange={setApplySmallAmountRule}
                disabled={!isNotice}
                label="150만원 미만 소액 면제 적용"
                description={isNotice
                  ? '고지서별·세목별 세액이 150만원 미만이면 고지 이후 가산세를 매기지 않습니다. 고지 전 일할분은 그대로 부과됩니다.'
                  : '고지분에만 적용되는 규정입니다.'}
              />
              <Checkbox
                checked={applyFiveYearCap && isNotice && !isMonthly}
                onChange={setApplyFiveYearCap}
                disabled={!isNotice || isMonthly}
                label="일할 가산세 5년 한도 적용"
                description={isMonthly
                  ? `월 단위 방식에서는 ${MONTHLY_REGIME.maxMonths}개월 한도가 대신 적용됩니다.`
                  : isNotice
                    ? '지정납부기한 다음 날부터 5년이 지난 기간에는 일할 가산세를 매기지 않습니다.'
                    : '고지분에만 적용되는 규정입니다.'}
              />
            </div>
          </Card>

          {/* 결과 */}
          {result.error ? (
            <Card tone={result.benign ? 'good' : 'bad'} className="text-center">
              <p className="text-sm font-bold">{result.error}</p>
            </Card>
          ) : (
            <>
              <ResultHero result={result} unpaid={unpaid} badges={badges} />

              {isMonthly && (
                <Card tone="info" className="animate-fade-up">
                  <p className="text-xs leading-relaxed">
                    <strong>월 단위 방식으로 계산했습니다.</strong> 납부고지일 {fmtDate(result.notice)}이(가)
                    {' '}{MONTHLY_REGIME.effectiveFrom.replace(/-/g, '.')} 이후라, 지정납부기한 후 구간을 일할이 아닌
                    {' '}매 1개월 {MONTHLY_REGIME.pct}로 계산했습니다. 고지 전 구간(①)은 종전대로 일할입니다.
                  </p>
                </Card>
              )}

              {result.capNote && (
                <Card tone="warn" className="animate-fade-up">
                  <p className="text-xs leading-relaxed">
                    <strong>원천세 한도가 적용되었습니다.</strong> {result.capNote}{' '}
                    한도 적용 전 금액은 {won(result.rawPenalty)}였습니다.
                  </p>
                </Card>
              )}

              {/* 항목별 구성 */}
              <Card tone="light" className="animate-fade-up">
                <h2 className="mb-2 text-sm font-bold text-slate-900">항목별 구성</h2>
                {result.lines.map(l => (
                  <ResultRow
                    key={l.key}
                    label={l.label}
                    note={l.note}
                    value={l.amount > 0 ? won(truncWon(l.amount)) : '미적용'}
                    muted={l.amount === 0}
                  />
                ))}
                <ResultRow
                  label="가산세 합계"
                  note={result.capNote ? '한도 적용 후' : null}
                  value={won(result.penaltyTotal)}
                />
              </Card>

              {/* 기간별 세율 적용 내역 */}
              <Card tone="light" className="animate-fade-up">
                <h2 className="mb-1 text-sm font-bold text-slate-900">기간별 세율 적용 내역</h2>
                <p className="mb-3 text-xs leading-relaxed text-slate-500">
                  일할 구간은 세율 개정 시행일(2019.2.12. · 2022.2.15.) 기준으로 잘라 각각의 세율을 적용합니다.
                </p>
                {result.segments.length === 0 ? (
                  <p className="rounded-lg bg-slate-50 px-3 py-3 text-xs text-slate-500">
                    일할로 계산된 구간이 없습니다.
                  </p>
                ) : (
                  <SegmentTable segments={result.segments} unpaid={unpaid} showGroup={isNotice} />
                )}

                {isMonthly && !result.paidWithinNoticeDue && !result.smallAmountExempt && (
                  <div className="mt-5 border-t border-slate-200 pt-4">
                    <h3 className="mb-2 text-sm font-bold text-slate-900">
                      월할 구간 ({MONTHLY_REGIME.pct} × 경과 개월)
                    </h3>
                    <MonthTable
                      unpaid={unpaid}
                      months={result.stage3Months}
                      start={result.noticeDue}
                      capped={result.cappedByMonths}
                    />
                  </div>
                )}
              </Card>

              {/* 계산 요약 */}
              <Card tone="light" className="animate-fade-up">
                <h2 className="mb-2 text-sm font-bold text-slate-900">계산 요약</h2>
                <ResultRow label="세목" value={isWithholding ? '원천세' : '일반 국세'} />
                <ResultRow label="납부 유형" value={isNotice ? '고지분' : '자진납부분'} />
                <ResultRow label="계산 방식" value={isMonthly ? '월 단위' : '일 단위'} />
                <ResultRow label="미납세액 (본세)" value={won(unpaid)} />
                <ResultRow label="가산세 기산일" value={fmtDateFull(result.start)} note="법정납부기한의 다음 날" />
                {isNotice && <ResultRow label="납부고지일" value={fmtDateFull(result.notice)} />}
                {isNotice && <ResultRow label="지정납부기한" value={fmtDateFull(result.noticeDue)} />}
                <ResultRow label="실제 납부일" value={fmtDateFull(result.pay)} />
                <ResultRow label="총 체납일수" value={`${nf.format(result.totalDays)}일`} />
                {isMonthly && (
                  <ResultRow
                    label="지정납부기한 후 경과 개월"
                    value={`${result.stage3Months}개월`}
                    note={result.cappedByMonths ? `${MONTHLY_REGIME.maxMonths}개월 한도 적용` : null}
                  />
                )}
                <ResultRow label="가산세 합계" value={won(result.penaltyTotal)} />
                {result.demandCost > 0 && <ResultRow label="독촉비용" value={won(result.demandCost)} />}
                <ResultRow label="총 납부액" value={won(result.grandTotal)} />
              </Card>

              {result.cappedByYears && (
                <Card tone="warn" className="animate-fade-up">
                  <p className="text-xs leading-relaxed">
                    <strong>5년 한도가 적용되었습니다.</strong> 지정납부기한 다음 날 {fmtDate(result.stage3Start)}부터
                    5년이 되는 {fmtDate(result.capDate)}까지만 일할 가산세를 계산했습니다.
                  </p>
                </Card>
              )}
            </>
          )}

          {/* 세율 연혁 */}
          <Card tone="light" className="animate-fade-up">
            <h2 className="mb-1 text-sm font-bold text-slate-900">세율 개정 연혁</h2>
            <p className="mb-3 text-xs text-slate-500">국세기본법 시행령 제27조의4 및 2026.7.1. 시행 개편</p>
            <RateTable />
          </Card>

          {/* 검증 안내 */}
          <Card tone="warn" className="animate-fade-up">
            <h2 className="mb-2 text-sm font-bold">⚠️ 2026.7.1. 개편분은 반드시 대조하세요</h2>
            <ul className="space-y-1.5 text-xs leading-relaxed">
              <li>
                월 단위 세율은 <strong>{MONTHLY_REGIME.pct}</strong>로 넣어두었습니다.
                지방세와 같은 <strong>0.66%</strong>로 확정되었을 가능성이 있으니 확인 후 코드 상단
                <code className="mx-1 rounded bg-amber-100 px-1 py-0.5">MONTHLY_REGIME.monthlyRate</code>만 고치면 됩니다.
              </li>
              <li>
                적용 대상을 <strong>고지서 발급일 기준</strong>으로 판정하도록 했습니다.
                체납일 기준이라면 <code className="mx-1 rounded bg-amber-100 px-1 py-0.5">regime</code> 판정식을 바꿔야 합니다.
              </li>
              <li>
                고지 전 구간(①)은 종전대로 일할이 유지된다고 가정했습니다.
              </li>
              <li>
                독촉비용은 법정 금액을 알 수 없어 <strong>직접 입력</strong>하도록 했습니다.
              </li>
            </ul>
          </Card>

          {/* 주의 */}
          <Card tone="muted" className="animate-fade-up">
            <h2 className="mb-3 text-sm font-bold text-slate-900">계산 전 확인할 것</h2>
            <ul className="space-y-2 text-xs leading-relaxed text-slate-600">
              <li>
                <strong className="text-slate-900">원천세는 3%가 무조건 붙습니다.</strong> 자진납부·수정신고여도
                미납세액의 3%에 일할(월할) 가산세가 더해지고, 총액 50% · 고지 전 부분 10% 한도가 적용됩니다.
              </li>
              <li>
                <strong className="text-slate-900">기간 안분이 핵심입니다.</strong> 세율 인하는 시행일 이후 기간분부터
                적용되므로, 하나의 세율로 전 기간을 곱하면 틀립니다.
              </li>
              <li>
                <strong className="text-slate-900">소액 면제는 고지 이후분만 빠집니다.</strong> 150만원 미만이어도
                법정기한 다음 날부터 고지일까지의 일할 가산세는 그대로 부과됩니다.
              </li>
              <li>
                <strong className="text-slate-900">이 계산기는 국세 기준입니다.</strong> 지방세는 지방세기본법의
                별도 세율·연혁을 따릅니다.
              </li>
              <li>
                <strong className="text-slate-900">신고 관련 가산세는 별도입니다.</strong> 무신고·과소신고 가산세는
                포함되지 않습니다.
              </li>
              <li>
                <strong className="text-slate-900">참고용입니다.</strong> 실제 고지 금액은 세목·기산일·감면 여부에 따라
                달라지니 홈택스 또는 담당 세무서 확인을 권합니다.
              </li>
            </ul>
          </Card>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      return (
        <div className="min-h-screen bg-slate-100 px-4 py-8 sm:px-6 sm:py-12">
          <div className="mx-auto max-w-2xl">
            <header className="mb-6">
              <h1 className="text-2xl font-black tracking-tight text-slate-900 sm:text-3xl">
                납부지연가산세 계산기
              </h1>
              <p className="mt-1.5 text-sm leading-relaxed text-slate-500">
                세목·납부 유형별로 나누고, 일할 세율 개정(0.03% → 0.025% → 0.022%)과
                2026.7.1. 이후 고지분의 월 단위 전환을 함께 반영합니다.
              </p>
            </header>

            <PenaltyCalculator />

            <p className="mt-8 text-center text-xs text-slate-400">
              모든 계산은 브라우저 안에서만 이루어집니다.
            </p>
          </div>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
