<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day 카운터</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <!-- ⚠️ 모든 CDN 버전 고정. Babel 은 반드시 7.x (8.x 는 인라인 text/babel 미지원) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
  <style>
    /* Tailwind 유틸리티로 표현이 어려운 부분만 정의 */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeUp .28s ease-out both; }

    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50%      { opacity: .45; }
    }
    .animate-pulse-soft { animation: pulseSoft 1.6s ease-in-out infinite; }

    /* 숫자 폭이 흔들리지 않도록 고정폭 숫자 사용 */
    .tabular { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ========================================
    // 🛠️ Utilities
    // ========================================

    const STORAGE_KEY = 'dday-counter:events';

    const PALETTES = [
      { key: 'rose',    ring: 'ring-rose-400/30',    text: 'text-rose-300',    bg: 'bg-rose-500/10',    bar: 'bg-rose-400',    glow: 'shadow-rose-500/20' },
      { key: 'sky',     ring: 'ring-sky-400/30',     text: 'text-sky-300',     bg: 'bg-sky-500/10',     bar: 'bg-sky-400',     glow: 'shadow-sky-500/20' },
      { key: 'amber',   ring: 'ring-amber-400/30',   text: 'text-amber-300',   bg: 'bg-amber-500/10',   bar: 'bg-amber-400',   glow: 'shadow-amber-500/20' },
      { key: 'emerald', ring: 'ring-emerald-400/30', text: 'text-emerald-300', bg: 'bg-emerald-500/10', bar: 'bg-emerald-400', glow: 'shadow-emerald-500/20' },
      { key: 'violet',  ring: 'ring-violet-400/30',  text: 'text-violet-300',  bg: 'bg-violet-500/10',  bar: 'bg-violet-400',  glow: 'shadow-violet-500/20' },
    ];

    const paletteOf = (key) => PALETTES.find(p => p.key === key) || PALETTES[0];

    /** 로컬 자정 기준 Date 생성 (타임존 밀림 방지) */
    function parseDateOnly(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d, 0, 0, 0, 0);
    }

    function todayMidnight() {
      const n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 0, 0, 0, 0);
    }

    function toISODate(date) {
      const p = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
    }

    /** 목표일까지 남은 일수. 오늘이면 0, 과거면 음수 */
    function daysUntil(iso) {
      const diff = parseDateOnly(iso).getTime() - todayMidnight().getTime();
      return Math.round(diff / 86400000);
    }

    /** D-30 / D-DAY / D+12 형태의 라벨 */
    function ddayLabel(iso) {
      const d = daysUntil(iso);
      if (d === 0) return 'D-DAY';
      return d > 0 ? `D-${d}` : `D+${Math.abs(d)}`;
    }

    function formatKoreanDate(iso) {
      const dt = parseDateOnly(iso);
      const week = ['일', '월', '화', '수', '목', '금', '토'][dt.getDay()];
      return `${dt.getFullYear()}년 ${dt.getMonth() + 1}월 ${dt.getDate()}일 (${week})`;
    }

    /** 자정까지 남은 시:분:초 — 오늘이 D-DAY 인 카드에만 표시한다 */
    function timeLeftToday(now) {
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
      const ms = next.getTime() - now.getTime();
      return {
        hours: Math.floor(ms / 3600000),
        minutes: Math.floor((ms % 3600000) / 60000),
        seconds: Math.floor((ms % 60000) / 1000),
      };
    }

    function loadEvents() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function saveEvents(events) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      } catch (e) {
        /* 저장 실패(사생활 보호 모드 등)해도 앱 동작은 계속된다 */
      }
    }

    function defaultEvents() {
      const t = todayMidnight();
      const plus = (n) => {
        const d = new Date(t);
        d.setDate(d.getDate() + n);
        return toISODate(d);
      };
      return [
        { id: 'sample-1', title: '수업 최종 발표', date: plus(14), color: 'sky',  memo: '슬라이드 10장 + 데모' },
        { id: 'sample-2', title: '프로젝트 마감',  date: plus(3),  color: 'rose', memo: '' },
      ];
    }

    const uid = () => `e-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, type = 'button', className = '', children, ...rest }) {
      const base = 'inline-flex items-center justify-center gap-1.5 rounded-xl font-semibold transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 disabled:opacity-40 disabled:cursor-not-allowed';
      const variants = {
        primary:   'bg-white text-slate-900 hover:bg-slate-200 active:scale-[.98] focus-visible:ring-white',
        secondary: 'bg-white/10 text-slate-100 hover:bg-white/20 active:scale-[.98] focus-visible:ring-white/40',
        danger:    'bg-rose-500/90 text-white hover:bg-rose-500 active:scale-[.98] focus-visible:ring-rose-400',
        ghost:     'bg-transparent text-slate-400 hover:text-slate-100 hover:bg-white/10 focus-visible:ring-white/40',
      };
      const sizes = {
        sm: 'px-2.5 py-1.5 text-xs',
        md: 'px-4 py-2.5 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
          {...rest}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, disabled = false, id, className = '', ...rest }) {
      const autoId = useRef(`in-${Math.random().toString(36).slice(2, 8)}`).current;
      const inputId = id || autoId;
      return (
        <div className={className}>
          {label && (
            <label htmlFor={inputId} className="mb-1.5 block text-xs font-medium text-slate-400">
              {label}
            </label>
          )}
          <input
            id={inputId}
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            aria-invalid={error ? 'true' : 'false'}
            className={`w-full rounded-xl border bg-slate-900/70 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-500 transition-colors focus:outline-none focus:ring-2 disabled:opacity-50 ${
              error
                ? 'border-rose-500/60 focus:border-rose-400 focus:ring-rose-500/30'
                : 'border-white/10 focus:border-white/30 focus:ring-white/20'
            }`}
            {...rest}
          />
          {error && <p className="mt-1.5 text-xs text-rose-400">{error}</p>}
        </div>
      );
    }

    function Card({ className = '', children, ...rest }) {
      return (
        <div
          className={`rounded-2xl border border-white/10 bg-white/[0.04] p-5 shadow-xl shadow-black/30 backdrop-blur ${className}`}
          {...rest}
        >
          {children}
        </div>
      );
    }

    function Badge({ className = '', children }) {
      return (
        <span className={`inline-flex items-center rounded-full px-2.5 py-1 text-[11px] font-semibold tracking-wide ${className}`}>
          {children}
        </span>
      );
    }

    function Modal({ isOpen, onClose, title, size = 'md', children }) {
      // ESC 로 닫기 + 열려 있는 동안 배경 스크롤 잠금
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        const prev = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        return () => {
          window.removeEventListener('keydown', onKey);
          document.body.style.overflow = prev;
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;

      const sizes = { sm: 'max-w-sm', md: 'max-w-md', lg: 'max-w-2xl' };

      return (
        <div
          className="fixed inset-0 z-50 flex items-end justify-center bg-black/70 backdrop-blur-sm sm:items-center sm:p-4"
          role="dialog"
          aria-modal="true"
          aria-label={title}
          onClick={onClose}
        >
          <div
            className={`animate-fade-up w-full ${sizes[size]} rounded-t-2xl border border-white/10 bg-slate-900 p-5 shadow-2xl sm:rounded-2xl`}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="mb-4 flex items-center justify-between">
              <h2 className="text-base font-bold text-slate-100">{title}</h2>
              <Button variant="ghost" size="sm" onClick={onClose} aria-label="닫기">✕</Button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    function Header({ count, onAdd }) {
      return (
        <header className="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h1 className="text-2xl font-black tracking-tight text-white sm:text-3xl">D-Day 카운터</h1>
            <p className="mt-1.5 text-sm text-slate-400">
              {count > 0 ? `${count}개의 일정을 세는 중` : '중요한 날을 등록해 보세요'}
            </p>
          </div>
          <Button onClick={onAdd} className="w-full sm:w-auto">
            <span aria-hidden="true">＋</span> 일정 추가
          </Button>
        </header>
      );
    }

    function EmptyState({ onAdd }) {
      return (
        <Card className="flex flex-col items-center gap-4 py-14 text-center">
          <div className="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/5 text-3xl" aria-hidden="true">📅</div>
          <div>
            <p className="text-base font-semibold text-slate-200">아직 등록된 일정이 없어요</p>
            <p className="mt-1 text-sm text-slate-500">시험, 여행, 마감일 — 무엇이든 좋아요.</p>
          </div>
          <Button onClick={onAdd}>첫 일정 추가하기</Button>
        </Card>
      );
    }

    /** 오늘이 D-DAY 인 일정에 붙는 자정까지 남은 시간 */
    function LiveClock({ now }) {
      const { hours, minutes, seconds } = timeLeftToday(now);
      const p = (n) => String(n).padStart(2, '0');
      return (
        <span className="tabular pb-1.5 text-xs font-medium text-slate-400">
          자정까지 {p(hours)}:{p(minutes)}:{p(seconds)}
        </span>
      );
    }

    function ColorPicker({ value, onChange }) {
      const swatch = {
        rose: 'bg-rose-400', sky: 'bg-sky-400', amber: 'bg-amber-400',
        emerald: 'bg-emerald-400', violet: 'bg-violet-400',
      };
      return (
        <div>
          <span className="mb-1.5 block text-xs font-medium text-slate-400">색상</span>
          <div className="flex gap-2" role="radiogroup" aria-label="색상 선택">
            {PALETTES.map((p) => (
              <button
                key={p.key}
                type="button"
                role="radio"
                aria-checked={value === p.key}
                aria-label={p.key}
                onClick={() => onChange(p.key)}
                className={`h-8 w-8 rounded-full ${swatch[p.key]} transition-transform focus:outline-none focus-visible:ring-2 focus-visible:ring-white ${
                  value === p.key ? 'scale-110 ring-2 ring-white ring-offset-2 ring-offset-slate-900' : 'opacity-60 hover:opacity-100'
                }`}
              />
            ))}
          </div>
        </div>
      );
    }

    function EventCard({ event, now, onEdit, onDelete }) {
      const remaining = daysUntil(event.date);
      const isToday = remaining === 0;
      const isPast = remaining < 0;
      const pal = paletteOf(event.color);

      // 등록일 → 목표일 진행률. createdAt 이 없는 항목은 30일 기준으로 잡는다.
      const progress = useMemo(() => {
        if (isPast) return 100;
        const target = parseDateOnly(event.date);
        const start = event.createdAt ? parseDateOnly(event.createdAt) : null;
        const total = start
          ? Math.max(1, Math.round((target - start) / 86400000))
          : Math.max(1, remaining + 30);
        const done = total - remaining;
        return Math.min(100, Math.max(0, Math.round((done / total) * 100)));
      }, [event.date, event.createdAt, remaining, isPast]);

      return (
        <Card className={`animate-fade-up relative overflow-hidden ring-1 ${pal.ring} ${isToday ? `shadow-2xl ${pal.glow}` : ''}`}>
          <div className={`pointer-events-none absolute -right-12 -top-12 h-40 w-40 rounded-full ${pal.bg} blur-2xl`} aria-hidden="true" />

          <div className="relative flex items-start justify-between gap-3">
            <div className="min-w-0 flex-1">
              <div className="flex flex-wrap items-center gap-2">
                <h3 className="truncate text-base font-bold text-slate-100">{event.title}</h3>
                {isToday && <Badge className="animate-pulse-soft bg-white text-slate-900">오늘!</Badge>}
                {isPast && <Badge className="bg-white/10 text-slate-400">지남</Badge>}
              </div>
              <p className="mt-1 text-xs text-slate-500">{formatKoreanDate(event.date)}</p>
            </div>

            <div className="flex shrink-0 gap-1">
              <Button variant="ghost" size="sm" onClick={() => onEdit(event)} aria-label={`${event.title} 수정`}>수정</Button>
              <Button variant="ghost" size="sm" onClick={() => onDelete(event)} aria-label={`${event.title} 삭제`}>삭제</Button>
            </div>
          </div>

          <div className="relative mt-4 flex items-end justify-between gap-3">
            <p className={`tabular text-4xl font-black tracking-tight sm:text-5xl ${isPast ? 'text-slate-500' : pal.text}`}>
              {ddayLabel(event.date)}
            </p>
            {isToday ? (
              <LiveClock now={now} />
            ) : (
              <span className="pb-1.5 text-xs text-slate-500">
                {isPast ? `${Math.abs(remaining)}일 경과` : `${remaining}일 남음`}
              </span>
            )}
          </div>

          <div className="relative mt-4 h-1.5 w-full overflow-hidden rounded-full bg-white/10">
            <div
              className={`h-full rounded-full ${isPast ? 'bg-slate-600' : pal.bar} transition-all duration-500`}
              style={{ width: `${progress}%` }}
              role="progressbar"
              aria-valuenow={progress}
              aria-valuemin="0"
              aria-valuemax="100"
              aria-label={`${event.title} 진행률`}
            />
          </div>

          {event.memo && <p className="relative mt-3 text-xs text-slate-400">{event.memo}</p>}
        </Card>
      );
    }

    function EventForm({ initial, onSubmit, onCancel }) {
      const [title, setTitle] = useState(initial ? initial.title : '');
      const [date, setDate] = useState(initial ? initial.date : toISODate(todayMidnight()));
      const [memo, setMemo] = useState(initial ? (initial.memo || '') : '');
      const [color, setColor] = useState(initial ? initial.color : 'sky');
      const [errors, setErrors] = useState({});

      const handleSubmit = (e) => {
        e.preventDefault();
        const next = {};
        if (!title.trim()) next.title = '일정 이름을 입력해 주세요.';
        if (!date) next.date = '날짜를 선택해 주세요.';
        else if (Number.isNaN(parseDateOnly(date).getTime())) next.date = '올바른 날짜가 아닙니다.';
        setErrors(next);
        if (Object.keys(next).length > 0) return;

        onSubmit({ title: title.trim(), date, memo: memo.trim(), color });
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4">
          <Input
            label="일정 이름"
            value={title}
            onChange={(e) => setTitle(e.target.value)}
            placeholder="예: 기말고사, 제주도 여행"
            error={errors.title}
            maxLength={40}
            autoFocus
          />
          <Input
            type="date"
            label="목표 날짜"
            value={date}
            onChange={(e) => setDate(e.target.value)}
            error={errors.date}
          />
          <Input
            label="메모 (선택)"
            value={memo}
            onChange={(e) => setMemo(e.target.value)}
            placeholder="준비할 것, 장소 등"
            maxLength={80}
          />
          <ColorPicker value={color} onChange={setColor} />

          {date && !errors.date && (
            <div className="rounded-xl border border-white/10 bg-slate-950/60 px-3.5 py-3 text-center">
              <p className={`tabular text-2xl font-black ${paletteOf(color).text}`}>{ddayLabel(date)}</p>
              <p className="mt-0.5 text-xs text-slate-500">{formatKoreanDate(date)}</p>
            </div>
          )}

          <div className="flex gap-2 pt-1">
            <Button type="submit" className="flex-1">{initial ? '수정 완료' : '추가하기'}</Button>
            <Button type="button" variant="secondary" onClick={onCancel}>취소</Button>
          </div>
        </form>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [events, setEvents] = useState(() => loadEvents() || defaultEvents());
      const [now, setNow] = useState(() => new Date());
      const [formOpen, setFormOpen] = useState(false);
      const [editing, setEditing] = useState(null);
      const [deleting, setDeleting] = useState(null);
      const [filter, setFilter] = useState('upcoming'); // upcoming | past | all

      // 1초마다 갱신 — D-DAY 카드의 자정 카운트다운과 날짜 넘어감 처리
      useEffect(() => {
        const id = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(id);
      }, []);

      useEffect(() => { saveEvents(events); }, [events]);

      const openAdd = useCallback(() => { setEditing(null); setFormOpen(true); }, []);
      const openEdit = useCallback((ev) => { setEditing(ev); setFormOpen(true); }, []);
      const closeForm = useCallback(() => { setFormOpen(false); setEditing(null); }, []);

      const handleSubmit = (data) => {
        if (editing) {
          setEvents(prev => prev.map(e => (e.id === editing.id ? { ...e, ...data } : e)));
        } else {
          setEvents(prev => [...prev, { id: uid(), createdAt: toISODate(todayMidnight()), ...data }]);
        }
        closeForm();
      };

      const confirmDelete = () => {
        setEvents(prev => prev.filter(e => e.id !== deleting.id));
        setDeleting(null);
      };

      // 가까운 순 정렬: 다가오는 일정 먼저, 지난 일정은 최근 순으로 뒤에
      const sorted = useMemo(() => {
        const withDays = events.map(e => ({ ...e, _d: daysUntil(e.date) }));
        const upcoming = withDays.filter(e => e._d >= 0).sort((a, b) => a._d - b._d);
        const past = withDays.filter(e => e._d < 0).sort((a, b) => b._d - a._d);
        return { upcoming, past, all: [...upcoming, ...past] };
      }, [events, now.toDateString()]);

      const visible = sorted[filter];

      const FILTERS = [
        { key: 'upcoming', label: '다가오는', count: sorted.upcoming.length },
        { key: 'past',     label: '지난',     count: sorted.past.length },
        { key: 'all',      label: '전체',     count: sorted.all.length },
      ];

      return (
        <div className="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 px-4 py-8 sm:px-6 sm:py-12">
          <div className="mx-auto max-w-4xl">
            <Header count={sorted.upcoming.length} onAdd={openAdd} />

            {events.length > 0 && (
              <div className="mb-5 flex gap-1.5 rounded-xl border border-white/10 bg-white/[0.03] p-1" role="tablist" aria-label="일정 필터">
                {FILTERS.map(f => (
                  <button
                    key={f.key}
                    role="tab"
                    aria-selected={filter === f.key}
                    onClick={() => setFilter(f.key)}
                    className={`flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40 ${
                      filter === f.key ? 'bg-white text-slate-900' : 'text-slate-400 hover:text-slate-100'
                    }`}
                  >
                    {f.label}
                    <span className="ml-1.5 text-xs opacity-60">{f.count}</span>
                  </button>
                ))}
              </div>
            )}

            {events.length === 0 ? (
              <EmptyState onAdd={openAdd} />
            ) : visible.length === 0 ? (
              <Card className="py-12 text-center text-sm text-slate-500">
                {filter === 'past' ? '지난 일정이 없습니다.' : '다가오는 일정이 없습니다.'}
              </Card>
            ) : (
              <div className="grid gap-4 sm:grid-cols-2">
                {visible.map(ev => (
                  <EventCard key={ev.id} event={ev} now={now} onEdit={openEdit} onDelete={setDeleting} />
                ))}
              </div>
            )}

            <p className="mt-8 text-center text-xs text-slate-600">일정은 이 브라우저에만 저장됩니다.</p>
          </div>

          <Modal isOpen={formOpen} onClose={closeForm} title={editing ? '일정 수정' : '새 일정 추가'}>
            <EventForm
              key={editing ? editing.id : 'new'}
              initial={editing}
              onSubmit={handleSubmit}
              onCancel={closeForm}
            />
          </Modal>

          <Modal isOpen={!!deleting} onClose={() => setDeleting(null)} title="일정 삭제" size="sm">
            <p className="text-sm text-slate-300">
              <span className="font-semibold text-white">{deleting && deleting.title}</span> 일정을 삭제할까요?
            </p>
            <p className="mt-1 text-xs text-slate-500">되돌릴 수 없습니다.</p>
            <div className="mt-5 flex gap-2">
              <Button variant="danger" onClick={confirmDelete} className="flex-1">삭제</Button>
              <Button variant="secondary" onClick={() => setDeleting(null)}>취소</Button>
            </div>
          </Modal>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
