<!doctype html>
<meta charset="utf-8">
<!-- @출력 04_이미지/2026-09-05_기준금리3.00_대출금리_반영시점/01_썸네일.png -->
<!-- @크기 1600x900 -->
<!--
  썸네일 — 로고와 같은 바탕에서 시작한다.
  아이보리 바탕 / 네이비 글자 / 분홍은 아주 조금.
  색 정의는 00_브랜드/색상.md
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden;
    font-family:'Malgun Gothic','맑은 고딕','Segoe UI',sans-serif;
    background:var(--ivory); color:var(--navy);
  }
  .card { width:1600px; height:900px; padding:80px 104px 0; display:flex; flex-direction:column;
          position:relative; }

  /* 로고의 온도계를 그대로 가져왔다. 오른쪽 여백을 채우면서 브랜드를 알아보게 한다. */
  .thermo { position:absolute; right:112px; top:196px; }

  .top { display:flex; justify-content:space-between; align-items:center; }
  .kicker { font-size:31px; letter-spacing:.5px; color:var(--muted); font-weight:700; }
  .brand { font-size:26px; color:var(--muted); letter-spacing:1px; }

  /* 온도계 눈금 — 로고의 눈금선을 옮겨온 장식 */
  .rate { display:flex; align-items:baseline; gap:20px; margin-top:34px; }
  .rate .num {
    font-size:176px; font-weight:800; line-height:1; letter-spacing:-5px; color:var(--navy-d);
  }
  .rate .unit { font-size:70px; font-weight:700; color:var(--pink); }

  .chg { font-size:37px; font-weight:700; color:var(--muted); margin-top:16px; }
  .chg b { color:var(--navy-d); }
  .chg .arw { color:var(--pink); margin:0 12px; }

  h1 { font-size:73px; font-weight:800; line-height:1.32; letter-spacing:-2.5px; margin-top:38px; }
  h1 em {
    font-style:normal;
    background:linear-gradient(transparent 64%, var(--pink-bg) 64%);
    padding-bottom:2px;
  }

  .strip {
    margin-top:auto; margin-left:-104px; margin-right:-104px;
    background:var(--cream); border-top:1px solid var(--line);
    padding:30px 104px; display:flex; align-items:center; gap:24px;
  }
  .step { display:flex; align-items:center; gap:13px; font-size:29px; color:var(--muted-l); }
  .step .dot { width:14px; height:14px; border-radius:50%; background:var(--line-d); }
  .step.on { color:var(--navy); font-weight:700; }
  .step.on .dot { background:var(--pink); }
  .sep { color:var(--line-d); font-size:29px; }
</style>
<div class="card">
  <div class="top">
    <div class="kicker">2026년 8월 27일 · 한국은행</div>
    <div class="brand">오늘의 재테크온도</div>
  </div>

  <svg class="thermo" width="230" height="430" viewBox="0 0 230 430" fill="none">
    <!-- 눈금 -->
    <g stroke-width="11" stroke-linecap="round" style="stroke:var(--navy)">
      <line x1="150" y1="96"  x2="205" y2="96"/>
      <line x1="150" y1="152" x2="205" y2="152"/>
      <line x1="150" y1="208" x2="205" y2="208"/>
      <line x1="150" y1="264" x2="205" y2="264"/>
    </g>
    <!-- 관 -->
    <path d="M52 96a34 34 0 0 1 68 0v168a34 34 0 0 1-68 0z" stroke-width="13" style="stroke:var(--navy-d)"/>
    <!-- 수은 -->
    <rect x="72" y="150" width="28" height="180" rx="14" style="fill:var(--pink)"/>
    <!-- 구 -->
    <circle cx="86" cy="336" r="66" stroke-width="13" style="fill:var(--ivory);stroke:var(--navy-d)"/>
    <circle cx="86" cy="336" r="44" style="fill:var(--pink)"/>
    <text x="86" y="356" font-size="52" font-weight="800"
          text-anchor="middle" font-family="'Malgun Gothic',sans-serif" style="fill:var(--ivory)">₩</text>
    <!-- 반짝임 -->
    <g stroke-width="11" stroke-linecap="round" style="stroke:var(--gold)">
      <line x1="168" y1="34" x2="188" y2="14"/>
      <line x1="176" y1="60" x2="204" y2="60"/>
    </g>
    <line x1="140" y1="26" x2="140" y2="0" stroke-width="11" stroke-linecap="round" style="stroke:var(--pink)"/>
  </svg>

  <div class="rate"><span class="num">3.00</span><span class="unit">%</span></div>
  <div class="chg">2.75%<span class="arw">→</span><b>3.00%</b></div>

  <h1>기준금리는 올랐는데<br><em>내 대출이자는 왜 그대로일까?</em></h1>

  <div class="strip">
    <div class="step on"><span class="dot"></span><span>기준금리 인상</span></div>
    <span class="sep">→</span>
    <div class="step"><span class="dot"></span><span>코픽스 발표 · 매월 15일</span></div>
    <span class="sep">→</span>
    <div class="step"><span class="dot"></span><span>내 대출금리 바뀌는 날</span></div>
  </div>
</div>
