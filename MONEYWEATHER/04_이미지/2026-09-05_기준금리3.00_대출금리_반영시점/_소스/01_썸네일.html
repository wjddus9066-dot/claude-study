<!-- @출력 04_이미지/2026-09-05_기준금리3.00_대출금리_반영시점/01_썸네일.png -->
<!-- @크기 1600x900 -->
<!--
  썸네일 — 목록에서 320px 폭으로 보인다. 그 크기에서 읽히는 것만 넣는다.

  세 가지를 지킨다.
    1. 제목을 그대로 옮겨 적지 않는다 (제목이 옆에 글자로 이미 보인다)
    2. 답을 다 주지 않는다
       「두 번의 기다림이 있다」까지만 말하고 그게 뭔지는 말하지 않는다.
       이름을 대는 순간 본문 [정답] 박스와 같은 내용이 되어 열 이유가 사라진다.
       (실제로 한 번 그렇게 만들었다가 되돌렸다)
    3. 가정을 단정으로 말하지 않는다
       (11월 20일은 본문에서 「예를 들어」로 든 가정이다. 여기 쓰지 않는다)
    4. 로고(온도계)를 넣지 않는다 — 그건 파비콘이다.
       MAINSKIN/images/icon-master.png 가 브라우저 탭과 검색 결과에서
       글 옆에 이미 붙는다. 썸네일에 또 넣으면 같은 마크가 두 번 나오고
       그림의 1/4을 잡아먹는다. 브랜드는 색과 블로그 이름이 이미 나른다.

  글자 크기 기준: 목록 폭 320px = 원본의 1/5.
  원본 100px 이상이라야 목록에서 20px로 읽힌다.

  색 정의는 00_브랜드/색상.md
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden;
    font-family:'Malgun Gothic','맑은 고딕','Segoe UI',sans-serif;
    background:var(--ivory); color:var(--navy);
  }
  .card { width:1600px; height:900px; padding:66px 96px 0;
          display:flex; flex-direction:column; position:relative; }

  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .rate { font-size:46px; font-weight:800; color:var(--navy-d); letter-spacing:-1px; }
  .rate span { color:var(--rose); }
  .brand { font-size:38px; color:var(--muted); letter-spacing:.5px; }

  /* 목록에서 이것만 읽혀도 성립해야 한다 */
  .hook { margin-top:72px; font-size:146px; font-weight:800;
          letter-spacing:-7px; line-height:1.12; color:var(--navy-d); }
  /* 답이 아니라 약속. 구체적인 답이 안에 있다는 것만 알린다 */
  .promise { margin-top:56px; font-size:54px; font-weight:700;
             line-height:1.38; color:var(--muted); letter-spacing:-1.5px; }

  .hook em {
    font-style:normal;
    background:linear-gradient(transparent 60%, var(--pink-bg) 60%);
  }


</style>
<div class="card">
  <div class="top">
    <div class="rate">기준금리 <span>3.00%</span> · 8월 27일 인상</div>
    <div class="brand">오늘의 재테크온도</div>
  </div>

  <div class="hook">사이에<br><em>두 번의 기다림</em></div>

  <div class="promise">내 이자가 언제 오르는지<br>날짜로 세어봤습니다</div>


</div>
