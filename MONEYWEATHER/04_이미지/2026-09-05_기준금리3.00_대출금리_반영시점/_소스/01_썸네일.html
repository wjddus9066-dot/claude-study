<!doctype html>
<meta charset="utf-8">
<!-- @출력 04_이미지/2026-09-05_기준금리3.00_대출금리_반영시점/01_썸네일.png -->
<!-- @크기 1600x900 -->
<!--
  썸네일 — 목록에서 이 그림 하나만 보고 클릭할지 정한다.

  제목을 그대로 옮겨 적지 않는다. 제목은 옆에 글자로 이미 보인다.
  대신 제목이 던진 질문의 「답의 모양」을 보여준다.
  여기서는 8월 27일에 오른 것이 11월에야 도착한다는 시차 그 자체.

  색 정의는 00_브랜드/색상.md
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden;
    font-family:'Malgun Gothic','맑은 고딕','Segoe UI',sans-serif;
    background:var(--ivory); color:var(--navy);
  }
  .card { width:1600px; height:900px; padding:74px 104px 0; display:flex; flex-direction:column;
          position:relative; }

  .top { display:flex; justify-content:space-between; align-items:center; }
  .kicker { font-size:30px; letter-spacing:.5px; color:var(--muted); font-weight:700; }
  .brand { font-size:26px; color:var(--muted); letter-spacing:1px; }

  /* 한 줄짜리 후킹 문구 — 제목을 반복하지 않고 질문만 남긴다 */
  .hook { margin-top:52px; font-size:68px; font-weight:800; letter-spacing:-2.5px; line-height:1.3; }
  .hook em {
    font-style:normal;
    background:linear-gradient(transparent 62%, var(--pink-bg) 62%);
  }

  /* 시차를 눈으로 보여주는 세 칸 — 점을 잇는 선을 점 뒤에 깐다 */
  .track { margin-top:76px; display:flex; position:relative; }
  .rail { position:absolute; left:16.6%; right:16.6%; top:14px;
          height:4px; background:var(--line-d); }
  .stop { flex:1; text-align:center; position:relative; }
  .dot { width:32px; height:32px; border-radius:50%; margin:0 auto;
         background:var(--line-d); position:relative;
         box-shadow:0 0 0 10px var(--ivory); }
  .stop.on .dot { background:var(--pink); }
  .stop.last .dot { background:var(--navy-d); }
  .stop .when { margin-top:26px; font-size:38px; font-weight:800; color:var(--navy-d); }
  .stop .what { margin-top:12px; font-size:27px; color:var(--muted); line-height:1.4; }

  .wait { margin-top:74px; font-size:34px; color:var(--muted); }
  .wait b { color:var(--rose); font-weight:800; }

  .foot { margin-top:auto; margin-left:-104px; margin-right:-104px;
          background:var(--cream); border-top:1px solid var(--line);
          padding:24px 104px; font-size:24px; color:var(--muted); }
</style>
<div class="card">
  <div class="top">
    <div class="kicker">2026년 8월 · 한국은행 기준금리 3.00%</div>
    <div class="brand">오늘의 재테크온도</div>
  </div>

  <div class="hook">금리는 8월에 올랐는데<br><em>내 이자는 11월에 오릅니다</em></div>

  <div class="track">
    <div class="rail"></div>
    <div class="stop on">
      <div class="dot"></div>
      <div class="when">8월 27일</div>
      <div class="what">기준금리 인상</div>
    </div>
    <div class="stop">
      <div class="dot"></div>
      <div class="when">10월 15일</div>
      <div class="what">코픽스 발표</div>
    </div>
    <div class="stop last">
      <div class="dot"></div>
      <div class="when">11월</div>
      <div class="what">내 이자 변경</div>
    </div>
  </div>

  <div class="wait">사이에 <b>두 번의 기다림</b>이 있습니다</div>

  <div class="foot">변동금리 대출 기준 · 대출 조건에 따라 시점은 달라집니다</div>
</div>
