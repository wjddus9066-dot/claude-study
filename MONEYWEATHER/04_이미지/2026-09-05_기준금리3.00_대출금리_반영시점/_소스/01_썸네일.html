<!--
  썸네일 — MAINSKIN/시안/글 썸네일 시안.png 의 방향을 따른다.

  본문이 「이해시키는 것」이라면 썸네일은 「궁금하게 만드는 것」이다.
  글자만 있으면 딱딱하다. 시안에서 가져온 네 가지.

    1. 카테고리 배지        — 왼쪽 위 알약
    2. 질문형 큰 제목        — 핵심 줄만 색으로
       글 제목을 그대로 옮기지 않는다. 「같은 뜻, 다른 문장」으로 쓴다.
         글 제목: ... 내 대출이자는 「왜」 아직 「그대로」일까?
         썸네일 : ... 내 통장엔    「언제」  「도착」할까?
       공유될 때는 이미지만으로 무슨 글인지 알 수 있고,
       목록에서는 제목 글자와 나란히 놓여도 같은 말이 두 번 나오지 않는다.
    3. 손글씨 말풍선         — 궁금증을 만드는 장치. 독자가 속으로 하는 말
    4. 일러스트가 절반       — 그림이 주인공, 글자가 거들기

  계속 지키는 것
    - 답을 다 주지 않는다. 「왜 그런지」는 말풍선으로 되묻기만 한다
    - 본문에서 「예를 들어」로 든 날짜(11월 20일)를 사실처럼 쓰지 않는다
    - 로고(온도계)를 넣지 않는다. 그건 파비콘이다
    - 목록 폭 320px에서 읽히는 크기만 (원본 100px 이상)

  글꼴: 학교안심 알림장 (OFL — 상업 이용·임베딩 자유. MAINSKIN/글꼴.md)
  이미지렌더.js 가 절대경로로 주입한다. 여기서는 이름만 쓴다.
  색 정의는 00_브랜드/색상.md
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden;
    font-family:'알림장','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--navy-d);
    position:relative;
  }

  /* 배경 장식 — 은은한 원 두 개. 밋밋함을 덜어준다 */
  .blob { position:absolute; border-radius:50%; }
  .blob.a { width:640px; height:640px; right:-140px; top:-200px; background:var(--pink-bg); }
  .blob.b { width:300px; height:300px; right:-60px; bottom:-110px; background:var(--gold-bg); }

  .card { position:relative; width:1600px; height:900px; padding:62px 80px 0; }

  .badge {
    display:inline-block; background:var(--ivory); border:3px solid var(--navy-d);
    border-radius:999px; padding:9px 30px; font-size:34px; font-weight:700;
  }

  h1 { margin-top:32px; font-size:98px; font-weight:700;
       line-height:1.24; letter-spacing:-3px; }
  h1 .hi { color:var(--rose); }

  /* 독자가 속으로 하는 말 — 이게 클릭을 만든다 */
  .bubble {
    position:relative; display:inline-block; margin-top:46px;
    background:var(--ivory); border:3px solid var(--line-d);
    border-radius:28px; padding:20px 34px;
    font-size:42px; color:var(--muted); line-height:1.34;
  }
  .bubble::after {
    content:''; position:absolute; left:60px; bottom:-21px;
    width:0; height:0; border:18px solid transparent;
    border-top-color:var(--line-d); border-bottom:0;
  }
  .bubble::before {
    content:''; position:absolute; left:64px; bottom:-15px; z-index:1;
    width:0; height:0; border:14px solid transparent;
    border-top-color:var(--ivory); border-bottom:0;
  }

  .brand { position:absolute; left:80px; bottom:48px;
           font-size:32px; color:var(--muted); }

  .art { position:absolute; right:84px; top:158px; }
</style>

<div class="blob a"></div>
<div class="blob b"></div>

<div class="card">

  <h1>금리 올랐다는 뉴스,<br>내 통장엔<br><span class="hi">언제 도착할까?</span></h1>
  <div class="bubble">이번 달 이자, 지난달이랑<br>똑같던데…?</div>
