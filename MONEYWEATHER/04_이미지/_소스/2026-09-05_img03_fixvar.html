<!doctype html>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden; background:#FEF8F3;
    font-family:'Malgun Gothic','맑은 고딕','Segoe UI',sans-serif; color:#1A3360;
    padding:46px 90px 0;
  }
  h2 { font-size:46px; font-weight:800; letter-spacing:-1.5px; }
  .sub { font-size:26px; color:#5E6E8F; margin-top:10px; }
  .wrap { display:flex; gap:48px; margin-top:18px; align-items:flex-start; }
  .right { flex:1; padding-top:16px; }
  .kv { background:#FEF8F3; border:2px solid #EADFD2; border-radius:16px; padding:18px 26px; margin-bottom:10px; }
  .kv .k { font-size:23px; color:#5E6E8F; }
  .kv .v { font-size:40px; font-weight:800; margin-top:8px; letter-spacing:-1px; }
  .kv.accent { border-color:#F7CE5A; background:#FDF6E6; }
  .kv.accent .v { color:#B94A65; }
  .kv .note { font-size:22px; color:#5E6E8F; margin-top:10px; line-height:1.45; }
  .src { margin-top:14px; font-size:22px; color:#8494B0; line-height:1.6; }
  .src b { color:#5E6E8F; }
</style>

<h2>지금은 고정금리가 더 비쌉니다</h2>
<div class="sub">2026년 7월에 새로 나간 주택담보대출 금리 · 단위 연 %</div>

<div class="wrap">
  <svg width="640" height="512" viewBox="0 0 700 560">
    <!-- baseline 0 at y=480, 5.0% at y=100 -->
    <g stroke="#EFE4D7" stroke-width="1">
      <line x1="90" y1="480" x2="660" y2="480"/>
      <line x1="90" y1="404" x2="660" y2="404"/>
      <line x1="90" y1="328" x2="660" y2="328"/>
      <line x1="90" y1="252" x2="660" y2="252"/>
      <line x1="90" y1="176" x2="660" y2="176"/>
      <line x1="90" y1="100" x2="660" y2="100"/>
    </g>
    <g font-size="23" fill="#8494B0" text-anchor="end" font-family="'Malgun Gothic',sans-serif">
      <text x="76" y="488">0</text>
      <text x="76" y="412">1</text>
      <text x="76" y="336">2</text>
      <text x="76" y="260">3</text>
      <text x="76" y="184">4</text>
      <text x="76" y="108">5</text>

    <line x1="90" y1="480" x2="660" y2="480" stroke="#D9CBBB" stroke-width="2"/>

    <!-- 변동형 4.35 -> h=331, y=149 -->
    <rect x="430" y="149" width="150" height="331" rx="6" fill="#F492A6"/>
    <text x="505" y="129" font-size="40" font-weight="800" fill="#1A3360" text-anchor="middle" font-family="'Malgun Gothic',sans-serif">4.35</text>
    <text x="505" y="522" font-size="30" font-weight="700" fill="#1A3360" text-anchor="middle" font-family="'Malgun Gothic',sans-serif">변동형</text>

    <!-- gap bracket between tops -->
    <line x1="628" y1="118" x2="628" y2="149" stroke="#B94A65" stroke-width="4"/>
    <line x1="616" y1="118" x2="640" y2="118" stroke="#B94A65" stroke-width="4"/>

  <div class="right">
    <div class="kv accent">
      <div class="k">고정금리 − 변동금리</div>
      <div class="v">한 달 약 10만원</div>

    </div>
    <div class="kv">
      <div class="k">7월에 새로 대출받은 사람 중</div>
      <div class="v">10명 중 3명</div>
      <div class="note">고정금리를 고른 사람 비율<br>2014년 이후로 가장 적었어요</div>
    </div>
    <div class="kv">
      <div class="k">그럼 변동금리가 답일까</div>
      <div class="v">아직 모릅니다</div>
      <div class="note">금리가 더 오르면 이 차이가 줄고<br>내려가면 계속 유리할 수도 있어요</div>
    </div>
  </div>
</div>
