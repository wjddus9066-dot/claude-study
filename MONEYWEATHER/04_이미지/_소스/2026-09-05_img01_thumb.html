<!doctype html>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden;
    font-family:'Malgun Gothic','맑은 고딕','Segoe UI',sans-serif;
    background:linear-gradient(160deg,#1d2b3a 0%,#24384c 55%,#2c4560 100%);
    color:#fff;
  }
  .card { width:1600px; height:900px; padding:86px 110px 0; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .kicker { font-size:32px; letter-spacing:1px; color:#8fb4d9; font-weight:700; }
  .brand { font-size:26px; color:#7d99b3; letter-spacing:1px; }

  .rate { display:flex; align-items:baseline; gap:22px; margin-top:40px; }
  .rate .num { font-size:178px; font-weight:800; line-height:1; letter-spacing:-4px; }
  .rate .unit { font-size:72px; font-weight:700; color:#cfe0f0; }
  .chg { font-size:38px; color:#7fc4a0; font-weight:700; margin-top:14px; }

  h1 { font-size:74px; font-weight:800; line-height:1.3; letter-spacing:-2px; margin-top:40px; }
  h1 em { font-style:normal; color:#ffd98a; }

  .strip {
    margin-top:auto; margin-left:-110px; margin-right:-110px;
    background:rgba(255,255,255,.06);
    border-top:1px solid rgba(255,255,255,.12);
    padding:32px 110px; display:flex; align-items:center; gap:26px;
  }
  .step { display:flex; align-items:center; gap:14px; font-size:30px; color:#a9c3da; }
  .step .dot { width:14px; height:14px; border-radius:50%; background:#5c7f9f; }
  .step.on { color:#fff; font-weight:700; }
  .step.on .dot { background:#ffd98a; }
  .sep { color:#5c7f9f; font-size:30px; }
</style>
<div class="card">
  <div class="top">
    <div class="kicker">2026년 8월 27일 · 한국은행</div>
    <div class="brand">오늘의 재테크온도</div>
  </div>

  <div class="rate"><span class="num">3.00</span><span class="unit">%</span></div>
  <div class="chg">2.75% &nbsp;→&nbsp; 3.00%</div>

  <h1>기준금리는 올랐는데<br><em>내 대출이자는 왜 그대로일까?</em></h1>

  <div class="strip">
    <div class="step on"><span class="dot"></span><span>기준금리 인상</span></div>
    <span class="sep">→</span>
    <div class="step"><span class="dot"></span><span>코픽스 발표 · 매월 15일</span></div>
    <span class="sep">→</span>
    <div class="step"><span class="dot"></span><span>내 대출금리 바뀌는 날</span></div>
  </div>
</div>
