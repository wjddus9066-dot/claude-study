  40%/20%/10% 를 문장으로만 쓰면 「3,000만원 넘으면 전체가 20%」로 잘못 읽는다.

  작게 고침 (2026-09-14, 사용자 「이미지가 부담스럽다」)
    전: 1080x1260 → 폭 420 에서 490px.  후: 880x440 → 폭 420 에서 334px
    그림 안 부제를 빼고(본문 소제목이 그 일을 한다) 막대 높이와 여백을 줄였다.

  근거: 조특법 제91조의28 제2항, 금융위원회 보도자료(2026-09-08) Ⅲ-2
