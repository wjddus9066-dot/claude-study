<!--
  썸네일 — CLAUDE.md §41.2

    1. 카테고리 배지   — 투자
    2. 질문형 큰 제목   — 글 제목과 같은 뜻, 다른 문장
         글 제목: 국민참여성장펀드 2차, 세금 깎아준다는데 20·30대도 「들어가볼 만할까?」
         썸네일 : 5년짜리 국민성장펀드,  내 세금은  「정말 줄어들까?」
    3. 손글씨 말풍선    — 사회초년생이 속으로 하는 말. 답은 주지 않는다
    4. 일러스트         — 투자 포트폴리오 카드(오르내리는 막대·선) + 자물쇠 + 5년 달력

  일러스트를 바꾼 이유 (2026-09-14, 사용자 지적)
    처음에는 돼지저금통을 그렸는데, 저금통은 「저축·안전하게 보관」으로 읽힌다.
    이 상품은 원금이 보장되지 않는 투자상품이라 첫인상이 어긋난다.
    그래서 값이 오르내리는 포트폴리오 카드로 바꾸고, 5년 잠김을 자물쇠로,
    기간을 달력으로 표시했다. 막대는 오르기만 하지 않는다 — 수익을 약속하지 않기 위해서다.

  지키는 것
    - 답을 주지 않는다 (결정세액 · 추징 14% 는 본문에서만)
    - 본문에 없는 숫자를 넣지 않는다 — 「5년」만 쓴다
    - 로고(온도계)를 넣지 않는다. 그건 파비콘이다

  글꼴: 학교안심 알림장 / 색: 변수로만
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden;
    font-family:'알림장','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--navy-d);
    position:relative;
  }
  .blob { position:absolute; border-radius:50%; }
  .blob.a { width:660px; height:660px; right:-160px; top:-210px; background:var(--gold-bg); }
  .blob.b { width:320px; height:320px; right:-70px; bottom:-120px; background:var(--pink-bg); }

  .card { position:relative; width:1600px; height:900px; padding:62px 80px 0; }
  .badge {
    display:inline-block; background:var(--ivory); border:3px solid var(--navy-d);
    border-radius:999px; padding:9px 34px; font-size:34px; font-weight:700;
  }
  h1 { margin-top:32px; font-size:98px; font-weight:700; line-height:1.24; letter-spacing:-3px; }
  h1 .hi { color:var(--rose); }

  .bubble {
    position:relative; display:inline-block; margin-top:46px;
    background:var(--ivory); border:3px solid var(--line-d);
    border-radius:28px; padding:20px 34px;
    font-size:42px; color:var(--muted); line-height:1.34;
  }
  .bubble::after {
    content:''; position:absolute; left:60px; bottom:-21px;
    border:18px solid transparent; border-top-color:var(--line-d); border-bottom:0;
  }
  .bubble::before {
    content:''; position:absolute; left:64px; bottom:-15px; z-index:1;
    border:14px solid transparent; border-top-color:var(--ivory); border-bottom:0;
  }
  .brand { position:absolute; left:80px; bottom:48px; font-size:32px; color:var(--muted); }
  .art { position:absolute; right:84px; top:176px; }
</style>

<div class="blob a"></div>
<div class="blob b"></div>

<div class="card">
  <div class="badge">투자</div>
  <h1>5년짜리 국민성장펀드,<br>내 세금은<br><span class="hi">정말 줄어들까?</span></h1>
  <div class="bubble">연봉 얼마 안 되는데<br>나도 혜택이 있나…?</div>
</div>
