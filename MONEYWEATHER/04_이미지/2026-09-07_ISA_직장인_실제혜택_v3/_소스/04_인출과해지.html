<!--
  5장 「3년 동안 돈이 묶이는 건가요?」 — 문장 네 개로 쓰면 초보자가
  「그래서 빼도 되는 거야, 안 되는 거야?」에서 멈춘다. 상황별 한 장씩으로 보여준다.

  세로형인 이유 — 처음 1600x900 가로형으로 만들었더니 폭 390px 화면에서
  글자가 5~7px로 줄어 읽히지 않았다(2026-09-13 스크린샷). 이 그림은 휴대폰에서
  읽혀야 의미가 있으므로 폭 1080에 글자를 크게 둔다. 폰에서 1/3로 줄어도 핵심 글자가 15px 안팎.

  칸마다 근거 (factcheck.md 8·9번)
    ① 원금 안에서 인출  — 한투 상품설명서(납입원금 한도·횟수 제한 없음·한도 원상회복 불가)
                           하나은행 「중도인출 가능 범위 내 인출 시 감면세액 추징하지 않음」
    ② 3년 전 원금 초과  — 조특법 제91조의18 제8항 「인출일에 계약이 중도해지된 것으로 보아」
    ③ 3년 전 해지       — 같은 조 제7항 (사망·해외이주 등 부득이한 사유 제외) / 시행령 제93조의4 제14항
    ④ 3년 채우고 해지   — 같은 조 제7항의 반대 경우

  쓰지 않은 것 — 3년이 지난 뒤 계좌를 둔 채 원금보다 많이 꺼낼 수 있는지는 확인하지 못했다.
  그래서 ②를 「3년 전」으로 좁혔다.

  색: 00_브랜드/색상.md — 직접 적지 않고 변수로 쓴다
