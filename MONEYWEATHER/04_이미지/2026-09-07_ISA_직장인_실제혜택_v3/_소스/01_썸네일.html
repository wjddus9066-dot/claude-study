<!--
  썸네일 — CLAUDE.md §41.2 / MAINSKIN/시안/글 썸네일 시안.png

  본문이 「이해시키는 것」이라면 썸네일은 「궁금하게 만드는 것」이다.

    1. 카테고리 배지        — 투자
    2. 질문형 큰 제목        — 글 제목과 같은 뜻, 다른 문장
         글 제목: ISA, 다들 좋다는데 그래서 나한테 「뭐가 좋은」 걸까?
         썸네일 : 다들 만들라는 ISA,  내 세금은  「얼마나 줄어들까?」
                                                 └── 묻는 말을 바꾼다 (뭐가 → 얼마나)
    3. 손글씨 말풍선         — 독자가 속으로 하는 말. 이 글의 반전(국내 주식은
                             원래 비과세)을 건드리되 답은 주지 않는다
    4. 일러스트              — 바구니(ISA)에 담기는 동전과 줄어드는 화살표

  지키는 것
    - 답을 다 주지 않는다. 「누구에게 얼마나」는 본문에서만
    - 본문에 없는 숫자를 넣지 않는다 (md2html.js 정합성 검사가 잡는다)
    - 로고(온도계)를 넣지 않는다. 그건 파비콘이다
    - 목록 폭 320px에서 읽히는 크기만 (원본 100px 이상)

  글꼴: 학교안심 알림장 — 이미지렌더.js 가 절대경로로 주입한다
  색: 00_브랜드/색상.md — 직접 적지 않고 변수로 쓴다
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden;
    font-family:'알림장','Malgun Gothic',sans-serif;
    background:var(--cream); color:var(--navy-d);
    position:relative;
  }

  /* 배경 장식 — 은은한 원 두 개 */
  .blob { position:absolute; border-radius:50%; }
  .blob.a { width:660px; height:660px; right:-160px; top:-210px; background:var(--gold-bg); }
  .blob.b { width:320px; height:320px; right:-70px; bottom:-120px; background:var(--pink-bg); }

  .card { position:relative; width:1600px; height:900px; padding:62px 80px 0; }

  .badge {
    display:inline-block; background:var(--ivory); border:3px solid var(--navy-d);
    border-radius:999px; padding:9px 34px; font-size:34px; font-weight:700;
  }

  h1 { margin-top:32px; font-size:98px; font-weight:700;
       line-height:1.24; letter-spacing:-3px; }
  h1 .hi { color:var(--rose); }

  /* 독자가 속으로 하는 말 — 이게 클릭을 만든다 */
  .bubble {
    position:relative; display:inline-block; margin-top:46px;
    background:var(--ivory); border:3px solid var(--line-d);
    border-radius:28px; padding:20px 34px;
    font-size:42px; color:var(--muted); line-height:1.34;
  }
  .bubble::after {
    content:''; position:absolute; left:60px; bottom:-21px;
    width:0; height:0; border:18px solid transparent;
    border-top-color:var(--line-d); border-bottom:0;
  }
  .bubble::before {
    content:''; position:absolute; left:64px; bottom:-15px; z-index:1;
    width:0; height:0; border:14px solid transparent;
    border-top-color:var(--ivory); border-bottom:0;
  }

  .brand { position:absolute; left:80px; bottom:48px;
           font-size:32px; color:var(--muted); }

  .art { position:absolute; right:96px; top:186px; }
</style>

<div class="blob a"></div>
<div class="blob b"></div>

<div class="card">
  <div class="badge">투자</div>
  <h1>다들 만들라는 ISA,<br>내 세금은<br><span class="hi">얼마나 줄어들까?</span></h1>
  <div class="bubble">주식만 하는데<br>나도 만들어야 하나…?</div>
</div>

<!-- 바구니(ISA)에 담기는 동전, 그리고 줄어드는 화살표 -->
<svg class="art" width="560" height="560" viewBox="0 0 560 560" fill="none">

  <!-- 동전 세 개 — 바구니로 들어가는 중 -->
  <g stroke-width="9" style="stroke:var(--navy-d)">
    <ellipse cx="120" cy="118" rx="52" ry="48" style="fill:var(--gold)"/>
    <ellipse cx="226" cy="78"  rx="52" ry="48" style="fill:var(--gold)"/>
    <ellipse cx="332" cy="118" rx="52" ry="48" style="fill:var(--gold)"/>
  </g>
  <text x="226" y="100" font-size="54" font-weight="700" text-anchor="middle"
        font-family="'알림장',sans-serif" style="fill:var(--navy-d)">₩</text>

  <!-- 바구니 -->
  <rect x="44" y="214" width="376" height="52" rx="18"
        style="fill:var(--ivory);stroke:var(--navy-d)" stroke-width="9"/>
  <path d="M78 266 L386 266 L342 452 Q336 470 318 470 L146 470 Q128 470 122 452 Z"
        style="fill:var(--ivory);stroke:var(--navy-d)" stroke-width="9" stroke-linejoin="round"/>
  <!-- 엮인 결 -->
  <g stroke-width="7" stroke-linecap="round" style="stroke:var(--line-d)">
    <line x1="112" y1="322" x2="352" y2="322"/>
    <line x1="124" y1="382" x2="340" y2="382"/>
    <line x1="182" y1="276" x2="168" y2="460"/>
    <line x1="282" y1="276" x2="296" y2="460"/>
  </g>

  <!-- 줄어드는 화살표 -->
  <g stroke-width="14" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--rose)">
    <line x1="486" y1="238" x2="486" y2="404"/>
    <polyline points="440,356 486,404 532,356" fill="none"/>
  </g>
</svg>

<div class="brand">☀ 오늘의 재테크온도</div>
