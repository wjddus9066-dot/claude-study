<!doctype html>
<meta charset="utf-8">
<!-- @출력 04_이미지/2026-09-07_ISA_직장인_실제혜택_v2/01_썸네일.png -->
<!-- @크기 1600x900 -->
<!--
  썸네일 — 로고와 같은 아이보리 바탕 / 네이비 글자.
  15.4% 가 0% 로 바뀌는 장면 하나만 보여준다.
  색은 05_자동화/팔레트.js 에서 온다. 여기에 색을 직접 적지 않는다.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; overflow:hidden;
    font-family:'Malgun Gothic','맑은 고딕','Segoe UI',sans-serif;
    background:var(--ivory); color:var(--navy);
  }
  .card { width:1600px; height:900px; padding:78px 104px 0; display:flex; flex-direction:column; position:relative; }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .kicker { font-size:31px; letter-spacing:.5px; color:var(--muted); font-weight:700; }
  .brand { font-size:26px; color:var(--muted); letter-spacing:1px; }

  h1 { font-size:76px; font-weight:800; line-height:1.3; letter-spacing:-2.5px; margin-top:40px; }
  h1 em {
    font-style:normal;
    background:linear-gradient(transparent 64%, var(--pink-bg) 64%);
    padding-bottom:2px;
  }

  .flow { display:flex; align-items:center; gap:40px; margin-top:52px; }
  .box { border:3px solid var(--line); border-radius:20px; padding:24px 44px; background:var(--cream); }
  .box .lb { font-size:26px; color:var(--muted); font-weight:700; }
  .box .vl { font-size:88px; font-weight:800; letter-spacing:-3px; line-height:1.1; margin-top:6px; }
  .box.on { border-color:var(--gold); background:var(--gold-bg); }
  .box.on .vl { color:var(--rose); }
  .arw { font-size:64px; color:var(--faint); font-weight:800; }
  .cap { font-size:30px; color:var(--muted); margin-left:20px; line-height:1.5; }
  .tail { font-size:34px; color:var(--navy); margin-top:56px; line-height:1.55; font-weight:700; }
  .tail span { color:var(--muted); font-weight:400; }
  .cap b { color:var(--navy-d); }

  .strip {
    margin-top:auto; margin-left:-104px; margin-right:-104px;
    background:var(--cream); border-top:1px solid var(--line);
    padding:30px 104px; display:flex; align-items:center; gap:26px;
  }
  .step { display:flex; align-items:center; gap:13px; font-size:29px; color:var(--muted-l); }
  .step .dot { width:14px; height:14px; border-radius:50%; background:var(--line-d); }
  .step.on { color:var(--navy); font-weight:700; }
  .step.on .dot { background:var(--pink); }
  .sep { color:var(--line-d); font-size:29px; }
</style>
<div class="card">
  <div class="top">
    <div class="kicker">2026년 9월 기준 · 개인종합자산관리계좌</div>
    <div class="brand">오늘의 재테크온도</div>
  </div>

  <h1>ISA, 다들 좋다는데<br><em>그래서 나한테 뭐가 좋은 걸까?</em></h1>

  <div class="flow">
    <div class="box">
      <div class="lb">그냥 계좌에서 벌면</div>
      <div class="vl">15.4%</div>
    </div>
    <div class="arw">→</div>
    <div class="box on">
      <div class="lb">ISA 안에서 벌면</div>
      <div class="vl">0%</div>
    </div>
    <div class="cap">단, <b>200만원</b>까지<br>넘으면 <b>9.9%</b></div>
  </div>

  <div class="tail">그런데 찾아보니 <span>바구니에 뭘 담느냐에 따라</span><br>혜택이 꽤 달라졌습니다.</div>

  <div class="strip">
    <div class="step on"><span class="dot"></span>세금부터</div>
    <div class="sep">·</div>
    <div class="step on"><span class="dot"></span>혜택 둘</div>
    <div class="sep">·</div>
    <div class="step on"><span class="dot"></span>나한테는?</div>
    <div class="sep">·</div>
    <div class="step"><span class="dot"></span>오늘 확인할 것</div>
  </div>
</div>
